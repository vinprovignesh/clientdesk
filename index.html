<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinpro Client Desk</title>
<meta name="description" content="Client master, portal logins, VAT and audit tracker for Vinpro Global Services WLL, Bahrain">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f4c81'/%3E%3Cpath d='M16 18l16 30 16-30' stroke='white' stroke-width='7' fill='none' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5f9; --panel:#ffffff; --panel-2:#f8fafc; --ink:#152033; --muted:#5b6880; --faint:#8c97ab; --line:#e1e6ee; --line-2:#eef1f6;
  --brand:#0f4c81; --brand-ink:#ffffff; --brand-soft:#e6eef7; --accent:#1f7a8c;
  --ok:#17804a; --ok-bg:#e5f5ec; --warn:#a15c00; --warn-bg:#fdf1de; --bad:#b83227; --bad-bg:#fbe7e5;
  --info:#2359a8; --info-bg:#e6effb; --pur:#6a3fb5; --pur-bg:#efe8fa; --grey:#56637a; --grey-bg:#edf0f5;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --radius:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141c; --panel:#171e29; --panel-2:#1c2431; --ink:#e7ecf3; --muted:#a3aec0; --faint:#77839a; --line:#2a3444; --line-2:#222b39;
    --brand:#4f93d6; --brand-ink:#0b1320; --brand-soft:#1d2d42; --accent:#4fb3c4;
    --ok:#5cc98f; --ok-bg:#15301f; --warn:#e6a64a; --warn-bg:#35270f; --bad:#f07a6e; --bad-bg:#3a1a17;
    --info:#7fb0f0; --info-bg:#172a45; --pur:#b69af0; --pur-bg:#2a2042; --grey:#aab4c5; --grey-bg:#252e3c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c; --panel:#171e29; --panel-2:#1c2431; --ink:#e7ecf3; --muted:#a3aec0; --faint:#77839a; --line:#2a3444; --line-2:#222b39;
  --brand:#4f93d6; --brand-ink:#0b1320; --brand-soft:#1d2d42; --accent:#4fb3c4;
  --ok:#5cc98f; --ok-bg:#15301f; --warn:#e6a64a; --warn-bg:#35270f; --bad:#f07a6e; --bad-bg:#3a1a17;
  --info:#7fb0f0; --info-bg:#172a45; --pur:#b69af0; --pur-bg:#2a2042; --grey:#aab4c5; --grey-bg:#252e3c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.brand b{display:block;font-size:14px;letter-spacing:.2px}
.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);cursor:pointer;border:0;background:none;text-align:left;width:100%;font-weight:500}
.nav:hover{background:var(--panel-2);color:var(--ink)}
.nav.on{background:var(--brand-soft);color:var(--brand)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;line-height:18px}
.side .spacer{flex:1}
.side .me{border-top:1px solid var(--line);padding:12px 8px 0;font-size:12.5px}
.side .me b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font-size:18px;margin:0;font-weight:650}
.top .sub{color:var(--muted);font-size:12.5px}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:22px 28px 60px;max-width:1500px;width:100%}
.demo-bar{background:var(--warn-bg);color:var(--warn);padding:7px 28px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-bar select{padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:550;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:550}
.kpi .v{font-size:28px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
.tbl td.cname{min-width:150px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:18px}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.card-h h3{margin:0;font-size:14.5px;font-weight:650}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:14px 16px}
.empty{color:var(--faint);padding:24px 16px;text-align:center}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.in, select.in, textarea.in{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;min-width:0}
.in:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.search{min-width:240px}
.tw{overflow:auto;border-radius:var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.3px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nowrap{white-space:nowrap}
.cname{font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;line-height:18px}
.chip.green{background:var(--ok-bg);color:var(--ok)}
.chip.amber{background:var(--warn-bg);color:var(--warn)}
.chip.red{background:var(--bad-bg);color:var(--bad)}
.chip.blue{background:var(--info-bg);color:var(--info)}
.chip.purple{background:var(--pur-bg);color:var(--pur)}
.chip.grey{background:var(--grey-bg);color:var(--grey)}
.chip.outline{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:550}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-block;font-size:11px;font-weight:650;padding:1px 6px;border-radius:5px;background:var(--brand-soft);color:var(--brand);margin:1px 2px 1px 0}
.avs{display:flex;flex-wrap:wrap;gap:4px}
.av{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:1px 8px 1px 2px;white-space:nowrap}
.av i{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;font-size:9.5px;font-weight:700;display:grid;place-items:center}
.over{color:var(--bad);font-weight:600}
.soon{color:var(--warn);font-weight:600}
.bar{height:6px;background:var(--line-2);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.progress-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.progress-row .bar{flex:1;min-width:160px;height:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:550;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--warn-bg);color:var(--ink);padding:10px 14px;border-radius:8px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{border-left-color:var(--info);background:var(--info-bg)}
.banner.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.ygrid td.cell{text-align:center;padding:5px 4px;min-width:58px}
.ygrid .yc{display:inline-block;min-width:50px;padding:3px 6px;border-radius:6px;font-size:11.5px;font-weight:650;cursor:pointer;border:1px solid transparent}
.ygrid .yc.overdue{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.ygrid .yc.future{opacity:.55}
.ygrid th.m{text-align:center}
.ygrid td.off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line-2) 6px 7px)}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:9px 16px;border-bottom:1px solid var(--line-2);font-size:13px}
.feed li:last-child{border-bottom:0}
.feed .when{color:var(--faint);font-size:11.5px}
/* modal */
.mwrap{position:fixed;inset:0;background:rgba(10,18,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:50}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:640px;border:1px solid var(--line)}
.modal.wide{max-width:1040px}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:17px}
.modal .mh .x{margin-left:auto}
.modal .mb{padding:18px 20px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel-2);border-radius:0 0 14px 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.form label,.form .lbl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.form label .in{font-weight:400;color:var(--ink);width:100%}
.form .hint{font-weight:400;font-size:11.5px;color:var(--faint)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.checks label{flex-direction:row;align-items:center;gap:7px;font-weight:500;color:var(--ink)}
.svc{display:flex;flex-wrap:wrap;gap:8px}
.svc label{flex-direction:row!important;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;color:var(--ink)!important;font-weight:550!important;background:var(--panel)}
.svc label:has(input:checked){background:var(--brand-soft);border-color:var(--brand);color:var(--brand)!important}
.svc input{accent-color:var(--brand);margin:0}
.tag.svc-tag{background:var(--ok-bg);color:var(--ok)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 18px}
.kv div span{display:block;font-size:11.5px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.kv div b{font-weight:550;word-break:break-word}
.secret{font-family:ui-monospace,Consolas,monospace;letter-spacing:.3px}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);padding:3px;border-radius:5px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.icon-btn svg{width:15px;height:15px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:99;font-weight:550;max-width:90vw}
.toast.err{background:var(--bad);color:#fff}
.center-screen{min-height:100vh;display:grid;place-items:center;padding:16px}
.login{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:34px;max-width:420px;width:100%;text-align:center}
.login .logo{width:52px;height:52px;margin:0 auto 14px;border-radius:13px}
.login .logo svg{width:30px;height:30px}
.login h1{font-size:21px;margin:0 0 4px}
.login p{color:var(--muted);margin:0 0 22px}
.ms-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-weight:600;font-size:14.5px}
.ms-btn:hover{border-color:var(--faint)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--accent));z-index:100;animation:bz 1s ease-in-out infinite alternate}
@keyframes bz{from{opacity:.4}to{opacity:1}}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--ok)}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .tbl td.cname{min-width:120px}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:2px}
  .brand,.side .spacer,.side .me{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 10px}
  .top{padding:12px 16px}
  .content{padding:16px 16px 50px}
  .demo-bar{padding:7px 16px}
  .form{grid-template-columns:1fr}
  .search{min-width:0;flex:1}
  .kpi .v{font-size:24px}
}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>

</head>
<body>
<div id="app"><div class="center-screen"><div><div class="spin"></div><div class="muted">Loading Client Desk…</div></div></div></div>
<div id="modals"></div>
<div id="toast"></div>
<script>
"use strict";
/* ============================================================
   CONFIG & CONSTANTS
   ============================================================ */
const CFG = Object.assign({
  companyName: "Vinpro Global Services WLL", appName: "Client Desk",
  tenantId: "", clientId: "", sharePointHost: "", sitePath: "",
  adminEmails: [], listPrefix: "VGS_", vatTrackingStart: "2026-01"
}, window.VINPRO_CONFIG || {});
const QS = new URLSearchParams(location.search);
const DEMO = QS.has("demo") || !CFG.clientId || /^YOUR/i.test(CFG.clientId) || typeof msal === "undefined";
const SCOPES = ["User.Read", "Sites.ReadWrite.All", "Sites.Manage.All"];

/* SharePoint list schema. 'text' = single line (255), 'note' = multi-line */
const SCHEMA = {
  employees: { list: "Employees", fields: { Title:"text", Email:"text", Role:"text", Active:"text", Phone:"text" } },
  clients:   { list: "Clients", fields: { Title:"text", CRNo:"text", CRExpiry:"text", Status:"text", ContactName:"text", ContactNo:"text", ContactEmail:"text",
                VATNo:"text", VATCycle:"text", VATFrom:"text", FYEnd:"text", AuditRequired:"text", AssignedTo:"note", Reviewer:"text", Services:"note", Notes:"note" } },
  creds:     { list: "Credentials", fields: { Title:"text", ClientId:"text", Username:"text", Pwd:"text", PortalURL:"text", Notes:"note", UpdatedBy:"text", UpdatedOn:"text" } },
  vat:       { list: "VATReturns", fields: { Title:"text", ClientId:"text", PeriodEnd:"text", Status:"text", Preparer:"text", Reviewer:"text", FiledDate:"text", RefNo:"text", Amount:"text", Notes:"note", UpdatedBy:"text", UpdatedOn:"text" } },
  audits:    { list: "Audits", fields: { Title:"text", ClientId:"text", FY:"text", Auditor:"text", AssignedTo:"text", Status:"text", DueDate:"text", CompletedDate:"text", Notes:"note", UpdatedBy:"text", UpdatedOn:"text" } },
  activity:  { list: "ActivityLog", fields: { Title:"text", ClientId:"text", ClientName:"text", UserEmail:"text", UserName:"text", Details:"note", At:"text" } }
};

const ROLES = ["Admin", "Manager", "Staff"];
const SERVICES = ["VAT", "Audit", "Accounting", "Consultancy", "HRMS & Payroll", "Others"];
const PORTALS = ["NBR", "Sijilat", "LMRA", "SIO", "Tally", "Odoo", "Zoho Books", "QuickBooks", "Bank (online banking)", "eGovernment / eKey", "Other"];
const PORTAL_URLS = { NBR:"https://www.nbr.gov.bh", Sijilat:"https://www.sijilat.bh", LMRA:"https://www.lmra.gov.bh", SIO:"https://www.sio.gov.bh" };
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const CYCLES = {
  "Q-Mar":  { label:"Quarterly (Jan–Mar, Apr–Jun, Jul–Sep, Oct–Dec)", short:"Qtr · Mar/Jun/Sep/Dec", n:3, r:0 },
  "Q-Jan":  { label:"Quarterly (Nov–Jan, Feb–Apr, May–Jul, Aug–Oct)", short:"Qtr · Jan/Apr/Jul/Oct", n:3, r:1 },
  "Q-Feb":  { label:"Quarterly (Dec–Feb, Mar–May, Jun–Aug, Sep–Nov)", short:"Qtr · Feb/May/Aug/Nov", n:3, r:2 },
  "Monthly":{ label:"Monthly", short:"Monthly", n:1 },
  "Not registered": { label:"Not VAT registered", short:"Not registered", n:0 }
};
const VAT_STATUSES = ["Not started","Data requested","Data received","In preparation","Under review","Filed","Paid / Closed","Nil return filed","Not applicable"];
const VAT_DONE = new Set(["Filed","Paid / Closed","Nil return filed","Not applicable"]);
const VAT_COLOR = {"Not started":"grey","Data requested":"amber","Data received":"blue","In preparation":"blue","Under review":"purple","Filed":"green","Paid / Closed":"green","Nil return filed":"green","Not applicable":"grey"};
const VAT_SHORT = {"Not started":"—","Data requested":"Req","Data received":"Rcvd","In preparation":"Prep","Under review":"Review","Filed":"Filed","Paid / Closed":"Paid","Nil return filed":"Nil","Not applicable":"N/A"};

const AUDIT_STATUSES = ["Not started","Engagement / Planning","Fieldwork","Draft FS issued","Management review","Signed","Filed with MOIC (Sijilat)","Not applicable"];
const AUDIT_DONE = new Set(["Filed with MOIC (Sijilat)","Not applicable"]);
const AUDIT_COLOR = {"Not started":"grey","Engagement / Planning":"amber","Fieldwork":"blue","Draft FS issued":"blue","Management review":"purple","Signed":"green","Filed with MOIC (Sijilat)":"green","Not applicable":"grey"};

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const curYM = () => todayISO().slice(0, 7);
const nowISO = () => new Date().toISOString();
const lc = s => String(s || "").trim().toLowerCase();
function fmtDate(s){ if(!s) return ""; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? `${m[3]} ${MONTHS[+m[2]-1]} ${m[1]}` : esc(s); }
function fmtDT(s){ if(!s) return ""; const d = new Date(s); if(isNaN(d)) return esc(s); return `${pad(d.getDate())} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function ymAdd(ym, n){ let [y, m] = ym.split("-").map(Number); m += n; y += Math.floor((m-1)/12); m = ((m-1)%12+12)%12+1; return `${y}-${pad(m)}`; }
function ymLabel(ym){ const [y, m] = ym.split("-").map(Number); return `${MONTHS[m-1]} ${y}`; }
function lastDay(ym){ const [y, m] = ym.split("-").map(Number); return `${ym}-${pad(new Date(y, m, 0).getDate())}`; }
function daysUntil(iso){ if(!/^\d{4}-\d{2}-\d{2}/.test(iso||"")) return null; const a = new Date(todayISO()+"T00:00:00"), b = new Date(iso.slice(0,10)+"T00:00:00"); return Math.round((b-a)/86400000); }
function initials(n){ return String(n||"?").split(/[\s.@_]+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join(""); }
function uid(){ return Math.random().toString(36).slice(2, 10); }
function relDays(d){ if(d == null) return ""; if(d === 0) return "due today"; if(d < 0) return `${-d} day${d===-1?"":"s"} overdue`; return `in ${d} day${d===1?"":"s"}`; }
function splitEmails(s){ return String(s||"").split(/[;,]/).map(lc).filter(Boolean); }

function cleanFields(kind, f){
  const out = {}; for(const k of Object.keys(SCHEMA[kind].fields)) if(k in f) out[k] = f[k] == null ? "" : String(f[k]);
  return out;
}

class GraphStore {
  constructor(app, account){ this.app = app; this.account = account; this.listIds = {}; this.missing = []; }
  async token(){
    const req = { scopes: SCOPES, account: this.account };
    try { return (await this.app.acquireTokenSilent(req)).accessToken; }
    catch(e){ if(e instanceof msal.InteractionRequiredAuthError){ await this.app.acquireTokenRedirect(req); } throw e; }
  }
  async g(method, path, body){
    const t = await this.token();
    const url = path.startsWith("http") ? path : "https://graph.microsoft.com/v1.0" + path;
    for(let attempt = 0; attempt < 4; attempt++){
      const r = await fetch(url, { method, headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
      if(r.status === 429 || r.status === 503){ const wait = (+r.headers.get("Retry-After") || 2) * 1000; await new Promise(res => setTimeout(res, wait)); continue; }
      if(r.status === 204) return null;
      const j = await r.json().catch(() => ({}));
      if(!r.ok) throw new Error((j.error && j.error.message) || `${r.status} ${r.statusText}`);
      return j;
    }
    throw new Error("Microsoft Graph is busy (throttled). Please retry in a minute.");
  }
  async init(){
    const site = await this.g("GET", `/sites/${CFG.sharePointHost}:${CFG.sitePath}`);
    this.siteId = site.id; this.siteUrl = site.webUrl;
    const lists = await this.g("GET", `/sites/${this.siteId}/lists?$select=id,displayName&$top=500`);
    for(const k in SCHEMA){ const l = lists.value.find(x => x.displayName === CFG.listPrefix + SCHEMA[k].list); if(l) this.listIds[k] = l.id; }
    this.missing = Object.keys(SCHEMA).filter(k => !this.listIds[k]);
  }
  async provision(onStep){
    for(const k of [...this.missing]){
      const columns = Object.entries(SCHEMA[k].fields).filter(([n]) => n !== "Title")
        .map(([name, t]) => ({ name, text: t === "note" ? { allowMultipleLines: true, linesForEditing: 6 } : {} }));
      onStep && onStep(CFG.listPrefix + SCHEMA[k].list);
      const l = await this.g("POST", `/sites/${this.siteId}/lists`, { displayName: CFG.listPrefix + SCHEMA[k].list, columns, list: { template: "genericList" } });
      this.listIds[k] = l.id;
    }
    this.missing = [];
  }
  norm(kind, it){ const r = { id: String(it.id) }; const f = it.fields || {}; for(const k of Object.keys(SCHEMA[kind].fields)) r[k] = f[k] == null ? "" : String(f[k]); return r; }
  async loadAll(){
    const out = {};
    await Promise.all(Object.keys(SCHEMA).map(async kind => {
      let url = `/sites/${this.siteId}/lists/${this.listIds[kind]}/items?$expand=fields&$top=999`; const rows = []; let guard = 0;
      while(url && guard++ < 60){ const j = await this.g("GET", url); for(const it of j.value) rows.push(this.norm(kind, it)); url = j["@odata.nextLink"] || null; }
      out[kind] = rows;
    }));
    return out;
  }
  async create(kind, fields){ const f = cleanFields(kind, fields); const it = await this.g("POST", `/sites/${this.siteId}/lists/${this.listIds[kind]}/items`, { fields: f }); return Object.assign({}, this.norm(kind, { id: it.id, fields: {} }), f); }
  async update(kind, id, fields){ await this.g("PATCH", `/sites/${this.siteId}/lists/${this.listIds[kind]}/items/${id}/fields`, cleanFields(kind, fields)); }
  async remove(kind, id){ await this.g("DELETE", `/sites/${this.siteId}/lists/${this.listIds[kind]}/items/${id}`); }
}

class DemoStore {
  constructor(){ this.missing = []; this.siteUrl = "(demo — data lives only in this browser tab)"; }
  async init(){}
  persist(){ try { localStorage.setItem("vinpro-demo", JSON.stringify(this.data)); } catch(e){} }
  async loadAll(){
    let saved = null; try { saved = JSON.parse(localStorage.getItem("vinpro-demo") || "null"); } catch(e){}
    this.data = saved && saved.clients ? saved : demoSeed();
    return JSON.parse(JSON.stringify(this.data));
  }
  async create(kind, fields){ const r = Object.assign({ id: uid() }, Object.fromEntries(Object.keys(SCHEMA[kind].fields).map(k => [k, ""])), cleanFields(kind, fields)); this.data[kind].push(r); this.persist(); return { ...r }; }
  async update(kind, id, fields){ const r = this.data[kind].find(x => x.id === id); if(r) Object.assign(r, cleanFields(kind, fields)); this.persist(); }
  async remove(kind, id){ this.data[kind] = this.data[kind].filter(x => x.id !== id); this.persist(); }
  reset(){ try { localStorage.removeItem("vinpro-demo"); } catch(e){} }
}

const isMgr = () => me.role === "Admin" || me.role === "Manager";
const isAdmin = () => me.role === "Admin";
function empName(email){ if(!email) return ""; const e = data.employees.find(x => lc(x.Email) === lc(email)); return e ? e.Title : email; }
function activeEmployees(){ return data.employees.filter(e => e.Active !== "No").sort((a,b) => a.Title.localeCompare(b.Title)); }
function clientById(id){ return data.clients.find(c => c.id === id); }
function teamOf(c){ const t = splitEmails(c.AssignedTo); return t; }
function isMine(c){ const e = lc(me.email); return teamOf(c).includes(e) || lc(c.Reviewer) === e; }
function canSee(c){ return isMgr() || isMine(c); }
function visibleClients(){ return data.clients.filter(canSee).sort((a,b) => a.Title.localeCompare(b.Title)); }
function roleOf(email){
  const e = lc(email);
  if((CFG.adminEmails || []).map(lc).includes(e)) return "Admin";
  const emp = data.employees.find(x => lc(x.Email) === e);
  if(emp) return emp.Active === "No" ? null : (emp.Role || "Staff");
  if(!data.employees.length && !(CFG.adminEmails || []).length) return "Admin"; // bootstrap: first user
  return null;
}
function isPeriodEnd(cycle, ym){ const c = CYCLES[cycle]; if(!c || !c.n) return false; if(c.n === 1) return true; return (+ym.slice(5)) % 3 === c.r; }
function periodLabel(cycle, pe){
  const n = (CYCLES[cycle] && CYCLES[cycle].n) || 3; if(n === 1) return ymLabel(pe);
  const st = ymAdd(pe, -(n-1)); const [sy, sm] = st.split("-"), [ey, em] = pe.split("-");
  return sy === ey ? `${MONTHS[sm-1]}–${MONTHS[em-1]} ${ey}` : `${MONTHS[sm-1]} ${sy} – ${MONTHS[em-1]} ${ey}`;
}
function dueOf(pe){ return lastDay(ymAdd(pe, 1)); }
function vatStart(c){ const a = CFG.vatTrackingStart || "2000-01", b = c.VATFrom || ""; return b > a ? b : a; }
function vatRec(cid, pe){ return data.vat.find(v => v.ClientId === cid && v.PeriodEnd === pe); }
function vatStatus(cid, pe){ const r = vatRec(cid, pe); return (r && r.Status) || "Not started"; }
function periodsFor(c, fromYm, toYm){ const out = []; if(!CYCLES[c.VATCycle] || !CYCLES[c.VATCycle].n) return out; const st = vatStart(c);
  for(let ym = fromYm; ym <= toYm; ym = ymAdd(ym, 1)) if(isPeriodEnd(c.VATCycle, ym) && ym >= st) out.push(ym); return out; }
function vatItems(clients, horizonDays = 45){
  const items = []; const cur = curYM();
  for(const c of clients){ if(c.Status === "Deactivated") continue;
    for(const pe of periodsFor(c, ymAdd(cur, -24), cur)){
      const st = vatStatus(c.id, pe); if(VAT_DONE.has(st)) continue; const due = dueOf(pe); const d = daysUntil(due);
      if(d <= horizonDays) items.push({ c, pe, due, d, st, rec: vatRec(c.id, pe) });
    } }
  return items.sort((a,b) => a.d - b.d);
}
function auditRec(cid, fy){ return data.audits.find(a => a.ClientId === cid && a.FY === String(fy)); }
function servicesOf(c){ return String(c.Services || "").split(";").map(x => x.trim()).filter(Boolean).map(x => /^others?\b/i.test(x) ? "Others" : (SERVICES.find(s => lc(s) === lc(x)) || x)); }
function otherServiceText(c){ const m = /others?\s*:\s*([^;]+)/i.exec(c.Services || ""); return m ? m[1].trim() : ""; }
function hasService(c, s){ return servicesOf(c).includes(s); }
function serviceTags(c){ return servicesOf(c).map(s => `<span class="tag svc-tag" ${s === "Others" && otherServiceText(c) ? `title="${esc(otherServiceText(c))}"` : ""}>${esc(s)}</span>`).join(""); }
function auditClients(list){ return list.filter(c => c.Status !== "Deactivated" && hasService(c, "Audit")); }
function crInfo(c){
  if(c.Status === "Deactivated") return { cls:"grey", txt:"Deactivated", d:null };
  const d = daysUntil(c.CRExpiry);
  if(d == null) return { cls:"outline", txt: c.CRExpiry ? esc(c.CRExpiry) : "Not set", d:null };
  if(d < 0) return { cls:"red", txt:`Expired ${fmtDate(c.CRExpiry)}`, d };
  if(d <= 30) return { cls:"amber", txt:`${fmtDate(c.CRExpiry)} · ${d}d`, d };
  return { cls:"outline", txt: fmtDate(c.CRExpiry), d };
}
function updCell(r){ if(!r || !r.UpdatedOn) return ""; return `<span title="${esc(empName(r.UpdatedBy))} · ${fmtDT(r.UpdatedOn)}">${esc(empName(r.UpdatedBy).split(" ")[0])} · ${fmtDate(r.UpdatedOn.slice(0,10)).slice(0,6)}</span>`; }
function chip(color, text, dot){ return `<span class="chip ${color}">${dot ? '<span class="dot"></span>' : ""}${text}</span>`; }
function vatChip(st){ return chip(VAT_COLOR[st] || "grey", esc(st), true); }
function auditChip(st){ return chip(AUDIT_COLOR[st] || "grey", esc(st), true); }
function avatars(emails){ return `<div class="avs">${emails.map(e => `<span class="av" title="${esc(e)}"><i>${esc(initials(empName(e)))}</i>${esc(empName(e).split(" ")[0])}</span>`).join("")}</div>`; }

async function withBusy(fn){ state.busy++; renderBusy(); try { return await fn(); } catch(e){ console.error(e); toast(e.message || String(e), true); throw e; } finally { state.busy--; renderBusy(); } }
async function saveRec(kind, id, fields){
  return withBusy(async () => {
    if(id){ await store.update(kind, id, fields); const r = data[kind].find(x => x.id === id); if(r) Object.assign(r, cleanFields(kind, fields)); return r; }
    const r = await store.create(kind, fields); data[kind].push(r); return r;
  });
}
async function removeRec(kind, id){ return withBusy(async () => { await store.remove(kind, id); data[kind] = data[kind].filter(x => x.id !== id); }); }

function vatMonthView(base){

  const pct = total ? Math.round(done / total * 100) : 0;
  return `<div class="card"><div class="card-b">
    <div class="progress-row"><div><b>Returns for periods ending ${ymLabel(pe)}</b><div class="small muted">NBR due date ${fmtDate(due)} · <span class="${d < 0 && done < total ? "over" : d <= 10 ? "soon" : ""}">${relDays(d)}</span></div></div>

function vatYearView(base){

/* ============================================================
   EXCEL IMPORT / EXPORT
   ============================================================ */
function normH(h){ return String(h || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
const MASTER_MAP = { "client name":"Title","client":"Title","company name":"Title","cr no":"CRNo","cr number":"CRNo","cr":"CRNo","cr expiry date":"CRExpiry","cr expiry":"CRExpiry","cr expiry dt":"CRExpiry",
  "client contact name":"ContactName","contact name":"ContactName","contact person":"ContactName","contact no":"ContactNo","contact number":"ContactNo","mobile":"ContactNo","phone":"ContactNo",
  "email":"ContactEmail","contact email":"ContactEmail","vat no":"VATNo","vat number":"VATNo","vat account no":"VATNo","trn":"VATNo","vat trn":"VATNo","notes":"Notes","remarks":"Notes" };
function cellStr(v){ if(v == null) return ""; if(v instanceof Date) return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`; if(typeof v === "number") return Number.isInteger(v) ? String(v) : String(v); return String(v).trim(); }
function parseWorkbook(buf){
  const wb = XLSX.read(buf, { type:"array" }); const out = [];
  for(const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:null });
    const hi = rows.findIndex(r => r && r.some(v => /client\s*name/i.test(String(v || "")))); if(hi < 0) continue;
    const H = rows[hi].map(normH); const map = {}; const portals = [];
    H.forEach((h, i) => { if(MASTER_MAP[h] && !(MASTER_MAP[h] in map)) map[MASTER_MAP[h]] = i; });
    H.forEach((h, i) => { const m = /^(.+?)\s+(login|user name|username|user id|userid|id)$/.exec(h); if(!m || MASTER_MAP[h]) return; const p = m[1].trim();
      const pj = H.findIndex(x => x === p + " pwd" || x === p + " password" || x === p + " pass"); portals.push({ name: rows[hi][i].toString().replace(/\s*(login|user\s*name|username|user\s*id|id)\s*$/i, "").trim(), ui: i, pi: pj }); });
    for(const r of rows.slice(hi + 1)){
      if(!r) continue; const title = cellStr(r[map.Title]); if(!title) continue;
      const f = { Status:"Active" }; for(const [k, i] of Object.entries(map)) f[k] = k === "CRExpiry" ? dateCell(r[i]) : cellStr(r[i]);
      if(/deactiv|cancel|struck/i.test(f.CRExpiry || "")){ f.Status = "Deactivated"; f.CRExpiry = ""; }
      const creds = portals.map(p => ({ Title: canonPortal(p.name), Username: cellStr(r[p.ui]), Pwd: p.pi >= 0 ? cellStr(r[p.pi]) : "" })).filter(x => x.Username || x.Pwd)
        .map(x => ({ ...x, PortalURL: PORTAL_URLS[x.Title] || "" }));
      out.push({ f, creds });
    }
  }
  return out;
}
function dateCell(v){ if(typeof v === "number" && v > 20000 && v < 80000){ const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }
  const s = cellStr(v); const m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(s); return m ? `${m[3]}-${pad(m[2])}-${pad(m[1])}` : s; }
function canonPortal(n){ const k = PORTALS.find(p => lc(p) === lc(n)); return k || n.replace(/\b\w/g, ch => ch.toUpperCase()); }
function matchClient(f){ return data.clients.find(c => (f.CRNo && lc(c.CRNo) === lc(f.CRNo)) || lc(c.Title) === lc(f.Title)); }

async function runImport(){
  const p = state.importPreview; if(!p) return; const mode = ($("#impMode") || {}).value || "skip"; const prog = () => $("#impProg");
  let added = 0, updated = 0, skipped = 0, logins = 0, i = 0;
  await withBusy(async () => {
    for(const row of p.rows){
      i++; if(prog()) prog().textContent = `Importing ${i} of ${p.rows.length}: ${row.f.Title}…`;
      let c = matchClient(row.f);
      if(c && mode === "skip"){ skipped++; continue; }
      if(c){ const upd = {}; for(const [k, v] of Object.entries(row.f)) if(v && k !== "Title") upd[k] = v; if(Object.keys(upd).length){ await store.update("clients", c.id, upd); Object.assign(c, upd); } updated++; }
      else { c = await store.create("clients", { ...row.f, FYEnd:"12-31" }); data.clients.push(c); added++; }
      for(const cr of row.creds){
        const ex = data.creds.find(x => x.ClientId === c.id && lc(x.Title) === lc(cr.Title));
        const f = { ...cr, ClientId: c.id, UpdatedBy: me.email, UpdatedOn: nowISO() };
        if(ex){ if(mode === "update"){ await store.update("creds", ex.id, f); Object.assign(ex, f); logins++; } }
        else { const r = await store.create("creds", f); data.creds.push(r); logins++; }
      }
    }
  });
  await logAct("Excel import", null, `${added} added, ${updated} updated, ${skipped} skipped, ${logins} logins saved`);
  state.importPreview = null; render(); toast(`Import done: ${added} added, ${updated} updated, ${skipped} skipped, ${logins} logins`);
}

  XLSX.writeFile(wb, `Vinpro-ClientDesk-Export-${todayISO()}.xlsx`);

  reveal: async d => { const x = data.creds.find(v => v.id === d.id); if(state.revealed[d.id]){ delete state.revealed[d.id]; } else { state.revealed[d.id] = true; await logAct("Viewed password", clientById(x.ClientId), x.Title); } renderModals(); },
  copyPwd: async d => { const x = data.creds.find(v => v.id === d.id); await copyText(x.Pwd); toast(`${x.Title} password copied`); await logAct("Copied password", clientById(x.ClientId), x.Title); },
  copyUser: async d => { const x = data.creds.find(v => v.id === d.id); await copyText(x.Username); toast("Username copied"); },
  delCred: d => { const x = data.creds.find(v => v.id === d.id); openModal("confirm", { text: `Delete the <b>${esc(x.Title)}</b> login for ${esc(clientById(x.ClientId).Title)}?`, onYes: async () => { await removeRec("creds", x.id); await logAct("Login deleted", clientById(x.ClientId), x.Title); } }); },
  delClient: d => { const c = clientById(d.id); openModal("confirm", { text: `Permanently delete <b>${esc(c.Title)}</b> and its saved logins? VAT/audit history stays in SharePoint. Consider setting status to <i>Deactivated</i> instead.`,
    onYes: async () => { for(const x of data.creds.filter(v => v.ClientId === c.id)) await removeRec("creds", x.id); await removeRec("clients", c.id); await logAct("Client deleted", c, ""); state.modals = []; } }); },
  confirmYes: async () => { const m = state.modals[state.modals.length - 1]; const fn = m.props.onYes; closeModal(); try { await fn(); } catch(e){} render(); renderModals(); },
  parseXlsx: async () => { const f = $("#xlsx").files[0]; if(!f) return toast("Choose the Excel file first", true); if(!window.XLSX) return toast("Excel library still loading — try again", true);
    try { const rows = parseWorkbook(await f.arrayBuffer()); if(!rows.length) return toast('No "Client Name" header row found in this file', true);
      state.importPreview = { rows: rows.map(r => ({ ...r, match: matchClient(r.f) })) }; render(); } catch(e){ console.error(e); toast("Could not read file: " + e.message, true); } },
  cancelImport: () => { state.importPreview = null; render(); },
  runImport: () => runImport(),
  export: () => exportXlsx(),
  closeOff: () => { const upto = $("#closeUpto").value; const items = [];
    for(const c of data.clients.filter(c => c.Status !== "Deactivated")) for(const pe of periodsFor(c, ymAdd(curYM(), -36), curYM())) if(dueOf(pe).slice(0, 7) <= upto && !VAT_DONE.has(vatStatus(c.id, pe))) items.push([c, pe]);
    if(!items.length) return toast("Nothing to close off — all periods up to that month already have a completed status");
    openModal("confirm", { text: `Mark <b>${items.length}</b> VAT return${items.length > 1 ? "s" : ""} (due up to ${ymLabel(upto)}) across ${new Set(items.map(x => x[0].id)).size} clients as <b>Filed</b>?`, onYes: async () => {
      for(const [c, pe] of items){ const r = vatRec(c.id, pe); await saveRec("vat", r ? r.id : null, { Title: c.id + "|" + pe, ClientId: c.id, PeriodEnd: pe, Status: "Filed", Notes: ((r && r.Notes) ? r.Notes + "\n" : "") + "Marked as filed at go-live", UpdatedBy: me.email, UpdatedOn: nowISO() }); }
      await logAct("VAT go-live close-off", null, `${items.length} returns due up to ${ymLabel(upto)} marked Filed`); toast(`${items.length} returns marked as filed`); } }); },
  demoreset: () => { store.reset(); location.reload(); }
};
document.addEventListener("click", e => {
  const wrap = e.target.classList && e.target.classList.contains("mwrap"); if(wrap){ closeModal(); return; }
  const a = e.target.closest("[data-act]"); if(!a || a.tagName === "SELECT") return;
  if(a.dataset.act === "sel" || a.dataset.act === "selAll"){ ACT[a.dataset.act](a.dataset, e); return; }
  if(a.tagName === "A") e.preventDefault();
  const fn = ACT[a.dataset.act]; if(fn) fn(a.dataset, e);
});
document.addEventListener("input", e => { const b = e.target.dataset && e.target.dataset.bind; if(b && e.target.tagName === "INPUT"){ const [o, k] = b.split("."); state[o][k] = e.target.value; render(); } });
document.addEventListener("change", e => {
  const t = e.target; const b = t.dataset && t.dataset.bind;
  if(b && t.tagName === "SELECT"){ const [o, k] = b.split("."); state[o][k] = t.value; render(); return; }
  if(t.dataset && t.dataset.act === "demouser"){ const emp = data.employees.find(x => lc(x.Email) === lc(t.value)); me = { email: emp.Email, name: emp.Title.replace(/\s*\(sample\)/, ""), role: null }; me.role = roleOf(me.email); state.cf.sel.clear(); state.modals = []; renderModals(); render(); toast(`Now viewing as ${me.name} (${me.role})`); }
  if(t.dataset && t.dataset.act === "portalPick"){ const url = t.form.querySelector('[name="PortalURL"]'); if(url && !url.value) url.value = PORTAL_URLS[t.value] || ""; }
});
document.addEventListener("submit", async e => {
  const form = e.target; const type = form.dataset.form; if(!type) return; e.preventDefault();
  const btns = form.querySelectorAll("button"); btns.forEach(b => b.disabled = true);
  try { await SUBMIT[type](form, formObj(form)); render(); renderModals(); } catch(err){ console.error(err); } finally { btns.forEach(b => b.disabled = false); }
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && state.modals.length) closeModal(); });

/* ============================================================
   BOOT
   ============================================================ */
function loginScreen(msg){
  $("#app").innerHTML = `<div class="center-screen"><div class="login"><div class="logo">${I.logo}</div>
    <h1>${esc(CFG.appName)}</h1><p>${esc(CFG.companyName)}<br><span class="small">Client master · Portal logins · VAT & audit tracker</span></p>
    <button class="ms-btn" id="msLogin">${I.ms} Sign in with Microsoft</button>
    ${msg ? `<div class="banner bad" style="margin-top:16px;text-align:left">${esc(msg)}</div>` : ""}
    <p class="small faint" style="margin:18px 0 0">Use your Vinpro Microsoft 365 work account.</p></div></div>`;
  $("#msLogin").onclick = () => msalApp.loginRedirect({ scopes: SCOPES, prompt: "select_account" });
}
function errorScreen(title, msg){
  $("#app").innerHTML = `<div class="center-screen"><div class="login" style="max-width:560px;text-align:left"><h1>${esc(title)}</h1><div class="banner bad" style="margin-top:12px">${esc(msg)}</div>
  <p class="small muted">Common causes: the SharePoint site path in config.js is wrong, admin consent was not granted for the app's Graph permissions, or your account isn't a member of the SharePoint site. See SETUP-GUIDE.md → Troubleshooting.</p>
  <button class="btn" onclick="location.reload()">Try again</button> ${msalApp ? `<button class="btn ghost" id="so">Sign out</button>` : ""}</div></div>`;
  const so = $("#so"); if(so) so.onclick = () => msalApp.logoutRedirect({ account });
}
async function start(){
  if(DEMO){
    store = new DemoStore(); await store.init(); data = await store.loadAll();
    const want = QS.get("as"); const emp = data.employees.find(e => lc(e.Email) === lc(want)) || data.employees[0];
    me = { email: emp.Email, name: emp.Title.replace(/\s*\(sample\)/, ""), role: null }; me.role = roleOf(me.email); render(); return;
  }
  msalApp = new msal.PublicClientApplication({ auth: { clientId: CFG.clientId, authority: `https://login.microsoftonline.com/${CFG.tenantId}`, redirectUri: location.origin + location.pathname, navigateToLoginRequestUrl: false }, cache: { cacheLocation: "localStorage" } });
  await msalApp.initialize();
  let res = null; try { res = await msalApp.handleRedirectPromise(); } catch(e){ return loginScreen(e.message); }
  account = (res && res.account) || msalApp.getAllAccounts()[0];
  if(!account) return loginScreen();
  msalApp.setActiveAccount(account);
  if(CFG.tenantId && account.tenantId && lc(account.tenantId) !== lc(CFG.tenantId)) return loginScreen("This account is not part of the Vinpro Microsoft 365 organisation.");
  me = { email: lc(account.username), name: account.name || account.username, role: null };
  $("#app").innerHTML = `<div class="center-screen"><div><div class="spin"></div><div class="muted">Connecting to SharePoint…</div></div></div>`;
  try {
    store = new GraphStore(msalApp, account); await store.init();
    if(store.missing.length){
      if(!(CFG.adminEmails || []).map(lc).includes(me.email)) return errorScreen("Not set up yet", "The Client Desk lists haven't been created on SharePoint yet. Ask the administrator to sign in once to complete setup.");
      $("#app").innerHTML = `<div class="center-screen"><div class="login"><div class="logo">${I.logo}</div><h1>First-time setup</h1><p>Create the ${store.missing.length} SharePoint lists the Client Desk needs on<br><b>${esc(store.siteUrl)}</b>?</p><button class="btn pri" id="prov">Create lists</button><p class="small muted" id="provMsg"></p></div></div>`;
      await new Promise(resolve => { $("#prov").onclick = async () => { $("#prov").disabled = true; try { await store.provision(n => $("#provMsg").textContent = "Creating " + n + "…"); resolve(); } catch(e){ errorScreen("Setup failed", e.message); } }; });
    }
    data = await store.loadAll();
    me.role = roleOf(me.email);
    if(me.role === "Admin" && !data.employees.some(e => lc(e.Email) === me.email)){
      const r = await store.create("employees", { Title: me.name, Email: me.email, Role: "Admin", Active: "Yes" }); data.employees.push(r);
    }
    render();
  } catch(e){ console.error(e); errorScreen("Couldn't load data", e.message); }
}
start().catch(e => { console.error(e); errorScreen("Something went wrong", e.message || String(e)); });
</script>
