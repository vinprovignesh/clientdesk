/* ============================================================
   BUDGET VS ACTUAL — Vinpro Global Services WLL (Bahrain)
   Cash basis, BHD, amounts include VAT. Inflow budget comes from fee lines
   set per Bahrain client and service; outflow budget is a monthly grid per
   expense head; actuals are the receipts and payments in the cash book.
   ============================================================ */
const FIN_HEADS_DEFAULT = ["Rent, EWA and LMRA", "Salary, Visa & Ticket", "Bahrain Exps - SG", "Car Rental", "Office Exps", "Reimbursement - Fees", "Accommodation", "Travel / Referral Fee", "Vinpro Dubai", "Vinpro Chennai", "Vignesh Chennai", "VAT paid to NBR"];
const FIN = {
  start: /^\d{4}-\d{2}$/.test(CFG.budgetStart || "") ? CFG.budgetStart : "2026-01",
  vat: CFG.vatRate != null && isFinite(+CFG.vatRate) ? +CFG.vatRate : 0.10,
  heads: Array.isArray(CFG.expenseHeads) && CFG.expenseHeads.length ? CFG.expenseHeads : FIN_HEADS_DEFAULT,
  access: Array.isArray(CFG.financeAccess) && CFG.financeAccess.length ? CFG.financeAccess : ["Admin"]
};
const FIN_KINDS = ["fees", "blines", "cash"];
const FEE_FREQ = { Monthly: 1, Quarterly: 3, "Half-yearly": 6, Annually: 12, "One-off": 0 };
const FEE_FREQ_SHORT = { Monthly: "/mo", Quarterly: "/qtr", "Half-yearly": "/half-yr", Annually: "/yr", "One-off": " once" };
/* Due date (credit days) of each invoice. The invoice is taken as raised at the end of the billing month
   (config invoiceAt: "end", or "start"); cash is budgeted in the month the due date falls. */
const FEE_TERMS = ["0", "30", "45", "60", "90"];
const FEE_TERMS_LABEL = { "0": "Immediate", "30": "30 days", "45": "45 days", "60": "60 days", "90": "90 days" };
const INVOICE_AT = CFG.invoiceAt === "start" ? "start" : "end";
const termsOf = f => FEE_TERMS.includes(String(f.Terms || "")) ? String(f.Terms) : (FEE_TERMS.includes(String(CFG.defaultTerms)) ? String(CFG.defaultTerms) : "0");
const termsOff = t => { const d = +t || 0; return INVOICE_AT === "start" ? Math.floor(d / 30) : Math.ceil(d / 30); };
const termsShort = t => +t ? `${t}d` : "on billing";
const FEE_TIMING = { Spread: "Spread evenly over the period", Lump: "Whole amount in the billing month" };
const PAY_MODES = ["Bank transfer", "BenefitPay", "Cheque", "Cash", "Card", "Other"];
const UNCLASSIFIED = "Unclassified";
const MM = Array.from({ length: 12 }, (_, i) => pad(i + 1));
const vatPct = () => `${+(FIN.vat * 100).toFixed(2)}%`;

const canFin = () => FIN.access.includes(me.role);
const fnum = v => { const n = parseFloat(String(v == null ? "" : v).replace(/[,\s]/g, "")); return isFinite(n) ? n : 0; };
const r3 = n => Math.round((+n || 0) * 1000) / 1000;
const r3s = n => { const v = r3(n); return v ? String(v) : ""; };
function money(n, dp = 3){ n = r3(n); const s = Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp }); return n < -0.0005 ? `(${s})` : s; }
function moneyZ(n, dp = 3){ return Math.abs(r3(n)) < 0.0005 ? `<span class="faint">—</span>` : money(n, dp); }
function finYms(from, to){ const out = []; for(let ym = from; ym <= to; ym = ymAdd(ym, 1)) out.push(ym); return out; }
function finClients(){ return data.clients.filter(c => locOf(c) === "Bahrain"); }
function deactYM(c){ return c && isDeact(c) && /^\d{4}-\d{2}/.test(c.DeactivatedOn || "") ? c.DeactivatedOn.slice(0, 7) : null; }
const feeVat = f => f.VAT !== "No";
function feesOf(cid){ return (data.fees || []).filter(f => f.ClientId === cid).sort((a, b) => (a.Service || "").localeCompare(b.Service || "")); }
const cashYm = x => String(x.Date || "").slice(0, 7);
const headOf = x => (x.Head || "").trim() || UNCLASSIFIED;

/* net (excl. VAT) budget of one fee line per month, within [from, to] */
/* VAT registration: until a "registered from" month is set, no VAT is added to fee budgets or worked
   out on receipts. Once set, VAT applies to invoices billed from that month on. */
function vatRegRec(){ return (data.blines || []).find(b => b.Kind === "Setting" && b.Head === "VATRegisteredFrom"); }
function vatFrom(){ const r = vatRegRec(); const v = r ? r.M01 : (CFG.vatRegisteredFrom || ""); return /^\d{4}-\d{2}$/.test(v || "") ? v : ""; }
const vatOn = ym => { const f = vatFrom(); return !!f && !!ym && ym >= f; };
const vatAny = () => !!vatFrom();
const vatTag = () => vatAny() ? "incl. VAT" : "no VAT (not VAT registered)";
/* per cash month: n = net fee, v = VAT on it (only for invoices billed once VAT registered) */
function feeSchedV(f, c, from, to){
  const out = {}; const amt = fnum(f.Amount); if(!amt) return out; const vr = feeVat(f) ? FIN.vat : 0;
  const n = FEE_FREQ[f.Freq] != null ? FEE_FREQ[f.Freq] : 1;
  const s = /^\d{4}-\d{2}$/.test(f.StartMonth || "") ? f.StartMonth : FIN.start;
  let e = /^\d{4}-\d{2}$/.test(f.EndMonth || "") ? f.EndMonth : "9999-12"; const d = deactYM(c); if(d && d < e) e = d;
  const off = termsOff(termsOf(f));
  const add = (bm, v) => { if(bm > e) return; const ym = ymAdd(bm, off); if(ym >= from && ym <= to && ym >= FIN.start){ const x = out[ym] || (out[ym] = { n: 0, v: 0 }); x.n += v; x.v += vr && vatOn(bm) ? v * vr : 0; } };
  if(n === 0){ add(s, amt); return out; }
  const spread = f.Timing !== "Lump" && n > 1;
  for(let ym = s; ym <= to && ym <= e; ym = ymAdd(ym, n)){ if(spread) for(let k = 0; k < n; k++) add(ymAdd(ym, k), amt / n); else add(ym, amt); }
  return out;
}
function feeGross(f, c, from, to){ const o = feeSchedV(f, c, from, to); let t = 0; for(const k in o) t += o[k].n + o[k].v; return t; }
function feeSched(f, c, from, to){
  const out = {}; const amt = fnum(f.Amount); if(!amt) return out;
  const n = FEE_FREQ[f.Freq] != null ? FEE_FREQ[f.Freq] : 1;
  const s = /^\d{4}-\d{2}$/.test(f.StartMonth || "") ? f.StartMonth : FIN.start;
  let e = /^\d{4}-\d{2}$/.test(f.EndMonth || "") ? f.EndMonth : "9999-12"; const d = deactYM(c); if(d && d < e) e = d;
  const off = termsOff(termsOf(f));
  /* bm = billing month (limited by the until month / deactivation); cash lands off months later */
  const add = (bm, v) => { if(bm > e) return; const ym = ymAdd(bm, off); if(ym >= from && ym <= to && ym >= FIN.start) out[ym] = (out[ym] || 0) + v; };
  if(n === 0){ add(s, amt); return out; }
  const spread = f.Timing !== "Lump" && n > 1;
  for(let ym = s; ym <= to && ym <= e; ym = ymAdd(ym, n)){ if(spread) for(let k = 0; k < n; k++) add(ymAdd(ym, k), amt / n); else add(ym, amt); }
  return out;
}
function feeLineText(f){ if(lc(f.Service) === "opening ar") return `Opening AR ${money(fnum(f.Amount))} <span class="faint">· expected ${f.StartMonth ? ymLabel(f.StartMonth) : ""}</span>`; return `${esc(f.Service || "Fee")} ${money(fnum(f.Amount))}${FEE_FREQ_SHORT[f.Freq] || ""} <span class="faint">· due ${termsShort(termsOf(f))}</span>`; }
function dueRuleText(t){ const off = termsOff(t); return `${FEE_TERMS_LABEL[t]}: an invoice for Jan is collected in ${MONTHS[off % 12]}${off ? ` (${off} month${off > 1 ? "s" : ""} later)` : " (same month)"}`; }
function finHeads(){
  const extra = new Set(); (data.blines || []).forEach(b => b.Kind === "Expense" && b.Head && extra.add(b.Head)); (data.cash || []).forEach(x => x.Dir === "Out" && extra.add(headOf(x)));
  const base = FIN.heads.slice(); const seen = new Set(base.map(lc));
  for(const h of extra) if(!seen.has(lc(h))){ base.push(h); seen.add(lc(h)); }
  const u = base.indexOf(UNCLASSIFIED); if(u >= 0) base.push(base.splice(u, 1)[0]);
  return base;
}
function canonHead(h){ const t = String(h || "").trim(); return finHeads().find(x => lc(x) === lc(t)) || t; }
function blRec(head, year){ return (data.blines || []).find(b => b.Kind === "Expense" && lc(b.Head) === lc(head) && String(b.Year) === String(year)); }
function openingRec(){ return (data.blines || []).find(b => b.Kind === "Opening"); }
function openingBal(){ const o = openingRec(); return o && o.M01 !== "" ? fnum(o.M01) : null; }

/* per-month budget & actual from start of tracking to `to` */
function finSeries(to){
  const from = FIN.start; const S = {};
  for(const ym of finYms(from, to)) S[ym] = { inB: 0, inBv: 0, inBar: 0, inA: 0, inAv: 0, outB: {}, outA: {}, outBt: 0, outAt: 0, byC: {} };
  const cl = new Map(finClients().map(c => [c.id, c]));
  for(const f of data.fees || []){ const c = cl.get(f.ClientId); const key = c ? c.id : isPartyAR(f) ? pkey(f.Party) : null; if(!key) continue; const sc = feeSchedV(f, c || null, from, to);
    for(const ym in sc){ const s = S[ym]; const net = sc[ym].n; const v = sc[ym].v; s.inB += net + v; s.inBv += v; if(isAR(f)) s.inBar += net + v; const bc = s.byC[key] || (s.byC[key] = { b: 0, a: 0 }); bc.b += net + v; } }
  for(const x of data.cash || []){ const s = S[cashYm(x)]; if(!s) continue; const a = fnum(x.Amount);
    if(x.Dir === "In"){ s.inA += a; s.inAv += vatOn(cashYm(x)) ? fnum(x.VAT) : 0; const k = x.ClientId || (String(x.ClientName || "").trim() ? pkey(x.ClientName) : "_none"); const bc = s.byC[k] || (s.byC[k] = { b: 0, a: 0 }); bc.a += a; }
    else { const h = headOf(x); s.outA[h] = (s.outA[h] || 0) + a; s.outAt += a; } }
  for(const b of data.blines || []){ if(b.Kind !== "Expense") continue;
    MM.forEach(m => { const s = S[`${b.Year}-${m}`]; const v = fnum(b["M" + m]); if(!s || !v) return; s.outB[b.Head] = (s.outB[b.Head] || 0) + v; s.outBt += v; }); }
  return S;
}
function finSum(S, yms){
  const t = { inB: 0, inBv: 0, inA: 0, inAv: 0, outB: {}, outA: {}, outBt: 0, outAt: 0, byC: {} };
  for(const ym of yms){ const s = S[ym]; if(!s) continue; for(const k of ["inB", "inBv", "inA", "inAv", "outBt", "outAt"]) t[k] += s[k];
    for(const k of ["outB", "outA"]) for(const h in s[k]) t[k][h] = (t[k][h] || 0) + s[k][h];
    for(const c in s.byC){ const x = t.byC[c] || (t.byC[c] = { b: 0, a: 0 }); x.b += s.byC[c].b; x.a += s.byC[c].a; } }
  return t;
}
function headAmt(map, h){ let v = 0; for(const k in map) if(lc(k) === lc(h)) v += map[k]; return v; }
/* lines of the report: dir +1 = inflow-like (actual above budget is good), -1 = outflow-like */
function finLines(t, closing){
  const L = [{ sec: "A · Cash inflow" }, { key: "in", label: `Fees collected from Bahrain clients${vatAny() ? " (incl. VAT)" : ""}`, b: t.inB, a: t.inA, dir: 1, act: "finGoClients" },
    ...(vatAny() ? [{ label: `of which output VAT (${vatPct()})`, b: t.inBv, a: t.inAv, dir: 1, sub: true }] : []), { sec: "B · Cash outflow" }];
  const heads = finHeads(); for(const h of heads){ const b = headAmt(t.outB, h), a = headAmt(t.outA, h); if(h === UNCLASSIFIED && !b && !a) continue; L.push({ label: h, b, a, dir: -1, ind: true, act: "finGoHead", h }); }
  L.push({ label: "Total cash outflow", b: t.outBt, a: t.outAt, dir: -1, tot: true });
  L.push({ label: "C · Net cash flow (A − B)", b: t.inB - t.outBt, a: t.inA - t.outAt, dir: 1, tot: true, net: true });
  if(closing) L.push({ label: "Closing cash & bank", b: closing.b, a: closing.a, dir: 1, sub: true, close: true });
  return L;
}
function varCell(b, a, dir){ const v = (a - b) * dir; if(Math.abs(r3(v)) < 0.0005) return `<td class="num faint">—</td><td class="num faint">—</td>`;
  const pct = Math.abs(b) > 0.0005 ? `${v > 0 ? "+" : "−"}${Math.abs(v / b * 100).toFixed(1)}%` : "";
  const cls = v > 0 ? "fav" : "adv"; return `<td class="num ${cls}">${money(v)}</td><td class="num small ${cls}">${pct}</td>`; }

state.ff = { tab: "summary", mode: "sheet", month: finDefMonth(), period: "ytd", cq: "", cbView: "exp", cbMonth: curYM() < FIN.start ? FIN.start : curYM(), cbDir: "", cbQ: "", cbHead: "", fq: "", fshow: "all", year: String(Math.max(+FIN.start.slice(0, 4), new Date().getFullYear())) };
function finMonthOpts(sel, extra){ const last = ymAdd(curYM() < FIN.start ? FIN.start : curYM(), 3); const ms = finYms(FIN.start, last).reverse();
  return (extra || "") + ms.map(m => `<option value="${m}" ${sel === m ? "selected" : ""}>${ymLabel(m)}</option>`).join(""); }
function finYearOpts(sel){ const ys = []; for(let y = +FIN.start.slice(0, 4); y <= new Date().getFullYear() + 1; y++) ys.push(String(y)); return ys.map(y => `<option ${String(sel) === y ? "selected" : ""}>${y}</option>`).join(""); }
function finYtdFrom(ym){ const y0 = ym.slice(0, 4) + "-01"; return y0 < FIN.start ? FIN.start : y0; }
function finClosing(S, ym){ const ob = openingBal(); if(ob == null || ym < FIN.start) return null; const t = finSum(S, finYms(FIN.start, ym)); return { b: ob + t.inB - t.outBt, a: ob + t.inA - t.outAt }; }

/* ---------- Monthly sheet: Opening balance · Income by client · Expenses · Closing · Check ---------- */
const CASH_ACCTS = Array.isArray(CFG.cashAccounts) && CFG.cashAccounts.length ? CFG.cashAccounts : ["Cash", "Petty Cash", "Beyon", "Ila Bank", "SBI Bank", "Flexi Deposit", "BBK Bank"];
const AR_SVC = "Opening AR";
const isAR = f => lc(f && f.Service) === lc(AR_SVC);
function arOf(cid){ return feesOf(cid).filter(isAR).reduce((s, f) => s + fnum(f.Amount), 0); }
function arCollected(cid){ return (data.cash || []).filter(x => x.Dir === "In" && x.ClientId === cid && lc(x.Service) === lc(AR_SVC)).reduce((s, x) => s + fnum(x.Amount), 0); }
/* Opening AR from parties that are not (yet) in the client list: fee lines with no ClientId and a Party name.
   Receipts with the same "Received from" name are set off against them. */
const pkey = n => "p:" + lc(n).replace(/\s+/g, " ");
const isPartyAR = f => !f.ClientId && isAR(f) && !!String(f.Party || "").trim();
function partyAR(){ const m = new Map();
  for(const f of data.fees || []){ if(!isPartyAR(f)) continue; const k = pkey(f.Party); const x = m.get(k) || { key: k, name: f.Party.trim(), lines: [], ar: 0, coll: 0 }; x.lines.push(f); x.ar += fnum(f.Amount); m.set(k, x); }
  for(const x of m.values()) x.coll = (data.cash || []).filter(c => c.Dir === "In" && !c.ClientId && String(c.ClientName || "").trim() && pkey(c.ClientName) === x.key).reduce((t, c) => t + fnum(c.Amount), 0);
  return [...m.values()].sort((a, b) => a.name.localeCompare(b.name)); }
function partyName(k){ const f = (data.fees || []).find(x => isPartyAR(x) && pkey(x.Party) === k); if(f) return f.Party.trim(); const c = (data.cash || []).find(x => !x.ClientId && x.ClientName && pkey(x.ClientName) === k); return c ? c.ClientName.trim() : k.slice(2); }
/* Receivables roll-forward. Opening AR of a month = all opening receivables (1 Jan) + fees that fell due in
   earlier months − cash collected in earlier months, so each month's collection shortfall carries forward. */
function arTotalOpening(){ const ids = new Set(finClients().map(c => c.id)); return (data.fees || []).filter(f => isAR(f) && (ids.has(f.ClientId) || isPartyAR(f))).reduce((t, f) => t + fnum(f.Amount), 0); }
function arRoll(S, ym){ let open = arTotalOpening();
  for(const k of finYms(FIN.start, ymAdd(ym, -1))){ const s = S[k]; if(!s) continue; open += (s.inB - s.inBar) - s.inA; }
  const s = S[ym] || { inB: 0, inBar: 0, inA: 0 }; const due = s.inB - s.inBar, coll = s.inA; return { open, due, coll, close: open + due - coll }; }
function arOutstandingAll(){ return finClients().reduce((t, c) => t + arOf(c.id) - arCollected(c.id), 0) + partyAR().reduce((t, x) => t + x.ar - x.coll, 0); }
function chkRec(acct, year){ return (data.blines || []).find(b => b.Kind === "Check" && lc(b.Head) === lc(acct) && String(b.Year) === String(year)); }
/* keyed balance for the month, or the last keyed balance carried forward (as in "=previous month") */
function chkVal(acct, ym){ for(let m = ym; m >= FIN.start; m = ymAdd(m, -1)){ const r = chkRec(acct, m.slice(0, 4)); const v = r ? r["M" + m.slice(5)] : ""; if(v !== "" && v != null) return { v: fnum(v), keyed: m === ym }; } return null; }
function chkTotal(ym){ let t = 0, any = false; for(const a of CASH_ACCTS){ const x = chkVal(a, ym); if(x){ t += x.v; any = true; } } return any ? t : null; }
function chkSave(acct, year, patch){ return finQueue(`chk|${lc(acct)}|${year}`, async () => { const r = chkRec(acct, year);
  await saveRec("blines", r ? r.id : null, Object.assign(r ? {} : { Title: acct, Kind: "Check", Head: acct, Year: String(year) }, patch, { UpdatedBy: me.email, UpdatedOn: nowISO() })); }); }

/* opening/closing per month: actual chains on actual closing; budget opens on last month's actual closing once that month is over */
function finSheetModel(Y){
  const S = finSeries(`${Y}-12`); const cur = curYM(); const ob = openingBal() || 0; const M = {}; let prev = null;
  for(const ym of finYms(FIN.start, `${Y}-12`)){ const s = S[ym];
    const o = { ym, oa: prev ? prev.ca : ob, ob: prev ? (prev.ym < cur ? prev.ca : prev.cb) : ob };
    o.ca = o.oa + s.inA - s.outAt; o.cb = o.ob + s.inB - s.outBt; M[ym] = o; prev = o; }
  return { S, M };
}
function finIncomeRows(S, yms){
  const ids = new Set(); for(const ym of yms) for(const k in S[ym].byC){ const x = S[ym].byC[k]; if(Math.abs(x.b) > 0.0005 || Math.abs(x.a) > 0.0005) ids.add(k); }
  const cl = finClients().filter(c => ids.has(c.id)).sort((a, b) => a.Title.localeCompare(b.Title));
  const parties = [...ids].filter(k => k.startsWith("p:")).sort((a, b) => partyName(a).localeCompare(partyName(b)));
  const other = [...ids].filter(k => !k.startsWith("p:") && !cl.some(c => c.id === k));
  const rows = cl.map(c => ({ label: c.Title, cid: c.id, get: (ym, k) => ((S[ym].byC[c.id] || {})[k] || 0) }));
  parties.forEach(pk => rows.push({ label: partyName(pk), party: pk, get: (ym, k) => ((S[ym].byC[pk] || {})[k] || 0) }));
  if(other.length) rows.push({ label: "Other receipts (not linked to a client)", get: (ym, k) => other.reduce((s, id) => s + ((S[ym].byC[id] || {})[k] || 0), 0) });
  return rows;
}
/* ---------- Monthly sheet: one month as a statement — opening → income → expenses → closing, with the cash & bank check ---------- */
function finSheetGrid(Y, ym){
  if(ym < FIN.start) return `<div class="card"><div class="empty">Tracking starts ${ymLabel(FIN.start)}.</div></div>`;
  const { S, M } = finSheetModel(Y); const s = S[ym], o = M[ym]; const cur = curYM();
  const status = ym > cur ? ["fut", "Forecast — no actuals yet"] : ym === cur ? ["live", "Month in progress"] : ["closed", "Month closed"];
  const hasAct = ym <= cur; const A = v => hasAct ? v : null;
  const pct = (a, b) => Math.abs(b) > 0.0005 && a != null ? a / b * 100 : null;
  const fmt = v => v == null ? `<span class="faint">—</span>` : Math.abs(r3(v)) < 0.0005 ? `<span class="faint">–</span>` : money(v);
  const varTxt = (b, a, dir) => { if(a == null) return `<span class="faint">—</span>`; const v = (a - b) * dir; if(Math.abs(r3(v)) < 0.0005) return `<span class="faint">–</span>`; return `<span class="${v > 0 ? "fav" : "adv"}">${v > 0 ? "▲" : "▼"} ${money(Math.abs(v))}</span>`; };
  const bar = (b, a, dir) => { const p = pct(a, b); if(p == null) return a ? `<div class="ms-bar"><i class="${dir > 0 ? "ok" : "bad"}" style="width:100%"></i></div><span class="ms-p">new</span>` : `<div class="ms-bar"></div><span class="ms-p faint">—</span>`;
    const over = p > 100; const good = dir > 0 ? p >= 100 : p <= 100; const w = Math.min(100, Math.max(0, p));
    return `<div class="ms-bar"><i class="${good ? "ok" : dir > 0 ? "warn" : "bad"}" style="width:${w}%"></i>${over ? `<b class="ms-over" style="left:${Math.min(100, 10000 / p)}%"></b>` : ""}</div><span class="ms-p">${Math.round(p)}%</span>`; };
  const row = (label, b, a, dir, extra, nobar) => `<tr class="${extra || ""}"><td class="ms-l">${label}</td><td class="num ms-b">${fmt(b)}</td><td class="num ms-a">${fmt(a)}</td><td class="num nowrap">${varTxt(b, a, dir)}</td><td class="ms-g">${nobar ? "" : bar(b, a, dir)}</td></tr>`;
  const head = `<thead><tr><th>Particulars</th><th class="num">Budget</th><th class="num">Actual</th><th class="num">Variance</th><th class="ms-g">Actual vs budget</th></tr></thead>`;

  /* income: clients with budget or actual this month */
  const inc = finIncomeRows(S, [ym]); const idle = finClients().filter(c => !isDeact(c)).length - inc.filter(r => r.cid).length;
  const incRows = inc.sort((p, q) => (q.get(ym, "b") + q.get(ym, "a")) - (p.get(ym, "b") + p.get(ym, "a"))).map(r => row(r.cid ? `<a href="#" data-act="finFees" data-id="${r.cid}">${esc(r.label)}</a>${arOf(r.cid) && (feesOf(r.cid).some(f => isAR(f) && f.StartMonth === ym)) ? ` <span class="ms-tag">AR</span>` : ""}` : r.party ? `${esc(r.label)} <span class="ms-tag" title="Not in the client list">Opening AR · not a client</span>` : `<span class="muted">${esc(r.label)}</span>`, r.get(ym, "b"), A(r.get(ym, "a")), 1)).join("");
  const heads = finHeads().filter(h => h !== UNCLASSIFIED || headAmt(s.outA, h));
  const expRows = heads.map(h => { const b = headAmt(s.outB, h), a = headAmt(s.outA, h); return (!b && !a) ? "" : row(`<a href="#" data-act="finGoHead" data-h="${esc(h)}" data-m="${ym}">${esc(h)}</a>`, b, A(a), -1); }).join("");
  const emptyHeads = heads.filter(h => !headAmt(s.outB, h) && !headAmt(s.outA, h)).length;

  /* hero: the cash bridge for the month */
  const tile = (cls, sign, label, b, a, dir) => { const v = a == null ? null : (a - b) * dir;
    return `<div class="ms-tile ${cls}"><div class="ms-tl">${sign ? `<span class="ms-sign">${sign}</span>` : ""}${label}</div><div class="ms-tv">${a == null ? money(b, 0) : money(a, 0)}</div>
      <div class="ms-ts">${a == null ? "Budget" : `Budget ${money(b, 0)}`}${v != null && Math.abs(v) >= 0.5 ? ` · <span class="${v > 0 ? "up" : "down"}">${v > 0 ? "▲" : "▼"} ${money(Math.abs(v), 0)}</span>` : ""}</div></div>`; };
  const hero = `<div class="ms-hero"><div class="ms-hh"><div><div class="ms-eyebrow">Vinpro Global Services WLL · Statement of cash</div><h2>${["January","February","March","April","May","June","July","August","September","October","November","December"][+ym.slice(5) - 1]} <span>${ym.slice(0, 4)}</span></h2></div>
      <div class="ms-nav"><button class="ms-arrow" data-act="finStep" data-v="-1" ${ym <= FIN.start ? "disabled" : ""} aria-label="Previous month">‹</button><span class="ms-status ${status[0]}">${status[1]}</span><button class="ms-arrow" data-act="finStep" data-v="1" aria-label="Next month">›</button></div></div>
    <div class="ms-bridge">${tile("open", "", "Opening balance", o.ob, A(o.oa), 1)}<i class="ms-op">+</i>${tile("in", "", "Income", s.inB, A(s.inA), 1)}<i class="ms-op">−</i>${tile("out", "", "Expenses", s.outBt, A(s.outAt), -1)}<i class="ms-op">=</i>${tile("close", "", "Closing balance", o.cb, A(o.ca), 1)}</div></div>`;

  /* reconciliation */
  const chk = hasAct ? chkTotal(ym) : null; const diff = chk == null ? null : r3(chk - o.ca);
  const recon = !hasAct ? `<div class="ms-recon none"><b>Not yet due</b><span>Key in balances once the month has started.</span></div>`

function finChart(S, Y){
  const yms = MM.map(m => `${Y}-${m}`).filter(ym => ym >= FIN.start); if(!yms.length) return ""; const cur = curYM();
  const rows = yms.map(ym => ({ ym, ...finSum(S, [ym]) }));
  const chart = (title, kb, ka) => { const max = Math.max(1, ...rows.map(r => Math.max(r[kb], r[ka]))); const W = 600, H = 190, pl = 44, pb = 22, pt = 10; const bw = (W - pl - 8) / 12;
    const yv = v => pt + (H - pt - pb) * (1 - v / max); const ticks = [0, max / 2, max];
    return `<div class="card fchart"><div class="card-h"><h3>${title}</h3><div class="right ch-legend small"><span><i class="lg-b"></i>Budget</span><span><i class="lg-a"></i>Actual</span></div></div><div class="card-b">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${ticks.map(t => `<line x1="${pl}" x2="${W - 4}" y1="${yv(t)}" y2="${yv(t)}" class="gl"/><text x="${pl - 6}" y="${yv(t) + 4}" class="ax" text-anchor="end">${t >= 1000 ? (t / 1000).toFixed(t >= 10000 ? 0 : 1) + "k" : Math.round(t)}</text>`).join("")}
      ${rows.map(r => { const i = +r.ym.slice(5) - 1; const x = pl + i * bw + bw * 0.14; const w = bw * 0.34; const hb = yv(0) - yv(r[kb]), ha = yv(0) - yv(r[ka]);
        return `<g><title>${ymLabel(r.ym)} · budget ${money(r[kb], 0)} · actual ${money(r[ka], 0)}</title><rect x="${x}" y="${yv(r[kb])}" width="${w}" height="${Math.max(0, hb)}" class="b-bud" rx="2"/>${r.ym <= cur ? `<rect x="${x + w + 2}" y="${yv(r[ka])}" width="${w}" height="${Math.max(0, ha)}" class="b-act" rx="2"/>` : ""}<text x="${x + w}" y="${H - 6}" class="ax" text-anchor="middle">${MONTHS[i]}</text></g>`; }).join("")}</svg></div></div>`; };
  return `<div class="fin-charts">${chart("Cash inflow by month", "inB", "inA")}${chart("Cash outflow by month", "outBt", "outAt")}</div>`;
}

    <select class="in" data-bind="ff.cbMonth">${finMonthOpts(f.cbMonth, years.map(y => `<option value="${y}" ${f.cbMonth === y ? "selected" : ""}>Whole year ${y}</option>`).join(""))}</select>

  <div class="strip"><div class="st ok"><div class="ic">↓</div><div><b>${money(inn, 0)}</b><span>receipts · ${rows.filter(x => x.Dir === "In").length} entries</span></div></div><div class="st ba"><div class="ic">↑</div><div><b>${money(out, 0)}</b><span>payments · ${rows.filter(x => x.Dir === "Out").length} entries</span></div></div><div class="st ${inn - out < 0 ? "ba" : "fu"}"><div class="ic">=</div><div><b>${money(inn - out, 0)}</b><span>net cash flow</span></div></div></div>

function finFeesView(){
  const f = state.ff; const Y = f.year; const q = lc(f.fq); const from = finYtdFrom(`${Y}-01`), to = `${Y}-12`;
  let cl = finClients().filter(c => !isDeact(c) || feesOf(c.id).length).filter(c => !q || lc(c.Title).includes(q)).sort((a, b) => a.Title.localeCompare(b.Title));
  const rows = cl.map(c => { const fs = feesOf(c.id); let net = 0, vat = 0, ar = 0; fs.forEach(x => { const sc = feeSchedV(x, c, from, to); let n = 0, v = 0; for(const k in sc){ n += sc[k].n; v += sc[k].v; } if(isAR(x)){ ar += n; return; } net += n; vat += v; }); return { c, fs, net, vat, ar, set: fs.some(x => !isAR(x)) }; });
  const act = rows.filter(r => !isDeact(r.c)); const missing = act.filter(r => !r.set).length;
  const shown = rows.filter(r => f.fshow === "missing" ? !r.set && !isDeact(r.c) : f.fshow === "set" ? r.set : true);
  const T = shown.reduce((s, r) => ({ net: s.net + r.net, vat: s.vat + r.vat, ar: s.ar + r.ar }), { net: 0, vat: 0, ar: 0 });
  return `<div class="toolbar"><select class="in" data-bind="ff.year" title="Budget year">${finYearOpts(Y)}</select>
    <input id="ff-fq" class="in search" placeholder="Search client…" value="${esc(f.fq)}" data-bind="ff.fq">
    <select class="in" data-bind="ff.fshow"><option value="all">All Bahrain clients</option><option value="missing" ${f.fshow === "missing" ? "selected" : ""}>Fee budget not set</option><option value="set" ${f.fshow === "set" ? "selected" : ""}>Fee budget set</option></select>
    <div class="right"><button class="btn" data-act="finFeeTemplate">Download fee sheet</button><button class="btn" data-act="finImport" data-v="fees">Upload fee sheet</button></div></div>
  <div class="strip"><div class="st fu"><div class="ic">BH</div><div><b>${act.length}</b><span>active Bahrain clients</span></div></div><div class="st ok"><div class="ic">✓</div><div><b>${act.length - missing}</b><span>with a fee budget</span></div></div><div class="st ${missing ? "wa" : "ok"}"><div class="ic">!</div><div><b>${missing}</b><span>fee budget not set</span></div></div><div class="st fu"><div class="ic">Σ</div><div><b>${money(T.net + T.vat + T.ar, 0)}</b><span>budgeted ${Y}${vatAny() ? " incl. VAT" : ""} & opening AR${from > `${Y}-01` ? ` (from ${ymLabel(from)})` : ""}</span></div></div></div>
  <div class="card vat-card ${vatAny() ? "on" : ""}"><div class="card-b"><div class="toolbar" style="margin:0;align-items:center">
    <div><b>VAT registration</b> ${vatAny() ? chip("green", `Registered from ${ymLabel(vatFrom())}`) : chip("grey", "Not VAT registered")}
      <div class="small muted">${vatAny() ? `VAT at ${vatPct()} is added to standard-rated fee lines billed from ${ymLabel(vatFrom())}, and worked out on receipts from then on. Earlier months stay without VAT.` : `No VAT is added to fee budgets or worked out on receipts. Each fee line keeps its VAT setting, so when the company registers, enter the month here and the cash flow picks up VAT from that month.`}</div></div>
    <div class="right"><label class="small">Registered from&nbsp;<input id="fin-vatreg" class="in" type="month" min="${FIN.start}" value="${esc(vatFrom())}"></label>${vatAny() ? `<button class="btn sm ghost" data-act="finVatClear">Not registered</button>` : ""}</div></div></div></div>
  <div class="banner info"><div>New Bahrain clients added in the Client Desk appear here automatically. Set a fee line for each service you bill — the amount <b>excluding VAT</b>, how often it is billed, from which month and its <b>due date</b> (immediate, 30, 45, 60 or 90 days). Collections are budgeted in the month each invoice falls due${vatAny() ? `, and VAT at ${vatPct()} is added to invoices billed from ${ymLabel(vatFrom())}` : " — no VAT is added while the company is not VAT registered"}. Use <b>Opening receivable (AR)</b> in a client's fees for amounts outstanding on 1 ${ymLabel(FIN.start)}, with the month you expect to collect them.</div></div>
  <div class="card"><div class="tw"><table class="tbl"><thead><tr><th>Client</th><th>Services</th><th>Fee lines</th><th class="num">${Y} net</th><th class="num">VAT</th><th class="num">Opening AR</th><th class="num">${Y} total</th><th></th></tr></thead><tbody>
  ${shown.map(r => `<tr><td class="cname">${esc(r.c.Title)}${isDeact(r.c) ? ` ${chip("grey", "Deactivated")}` : ""}</td><td>${serviceTags(r.c) || `<span class="faint small">none ticked</span>`}</td>
    <td class="small">${r.fs.map(feeLineText).join("<br>")}${r.set ? "" : (r.fs.length ? "<br>" : "") + chip("amber", "Fees not set")}</td><td class="num">${moneyZ(r.net)}</td><td class="num small">${moneyZ(r.vat)}</td><td class="num small">${moneyZ(r.ar)}</td><td class="num"><b>${moneyZ(r.net + r.vat + r.ar)}</b></td>
    <td><button class="btn sm" data-act="finFees" data-id="${r.c.id}">${r.fs.length ? "Edit fees" : "Set fees"}</button></td></tr>`).join("")}
  </tbody><tfoot><tr class="tot"><td>Total</td><td></td><td></td><td class="num">${money(T.net)}</td><td class="num">${money(T.vat)}</td><td class="num">${money(T.ar)}</td><td class="num">${money(T.net + T.vat + T.ar)}</td><td></td></tr></tfoot></table>
  ${shown.length ? "" : `<div class="empty">No clients match.</div>`}</div></div>
  ${(() => { const P = partyAR(); return `<div class="card"><div class="card-h"><h3>Opening AR — parties not in the client list</h3><div class="right"><button class="btn sm pri" data-act="finArParty">${I.plus} Add opening receivable</button></div></div>

      <td class="num">${money(x.ar)}</td><td class="num">${moneyZ(x.coll)}</td><td class="num"><b>${money(x.ar - x.coll)}</b></td><td><button class="btn sm" data-act="finCashAdd" data-v="In" data-p="${esc(x.name)}">Receipt</button></td></tr>`).join("")}
    </tbody><tfoot><tr class="tot"><td>Total</td><td></td><td class="num">${money(P.reduce((t, x) => t + x.ar, 0))}</td><td class="num">${money(P.reduce((t, x) => t + x.coll, 0))}</td><td class="num">${money(P.reduce((t, x) => t + x.ar - x.coll, 0))}</td><td></td></tr></tfoot></table></div>`
    : `<div class="card-b small muted">For amounts owed on 1 ${ymLabel(FIN.start)} by someone who isn't in the client list — e.g. a one-off job. They show in the budget and statement under their own name, and receipts recorded with the same “Received from” name are set off against them.</div>`}</div>`; })()}`;
}

function finExpView(){
  const Y = state.ff.year; const heads = finHeads().filter(h => h !== UNCLASSIFIED || blRec(h, Y)); const ob = openingRec();
  const prevHas = (data.blines || []).some(b => b.Kind === "Expense" && String(b.Year) === String(+Y - 1));
  const colTot = m => heads.reduce((s, h) => s + fnum((blRec(h, Y) || {})["M" + m]), 0);
  const isFirst = Y === FIN.start.slice(0, 4);
  return `<div class="toolbar"><select class="in" data-bind="ff.year" title="Budget year">${finYearOpts(Y)}</select><span class="small muted">Monthly budget per expense head, BHD incl. VAT. Type an amount and press Tab — it saves automatically.</span>
    <div class="right">${prevHas ? `<button class="btn" data-act="finExpCopy" data-v="${Y}">Copy ${+Y - 1} budget</button>` : ""}<button class="btn" data-act="finHeadAdd">${I.plus} Add expense head</button></div></div>
  ${isFirst ? `<div class="card"><div class="card-b"><div class="toolbar" style="margin:0"><label class="small"><b>Opening cash & bank balance on 1 ${ymLabel(FIN.start)}</b> (BHD)&nbsp; <input id="fin-ob" class="in fin-cell" style="width:140px" inputmode="decimal" data-fin="ob" value="${esc(ob ? ob.M01 : "")}" placeholder="e.g. 15000"></label><span class="small muted">Used for the closing cash line on the Budget vs Actual report.</span></div></div></div>` : ""}
  <div class="card"><div class="tw"><table class="tbl fin fin-exp nosort"><thead><tr><th>Expense head</th>${MM.map(m => `<th class="num">${MONTHS[+m - 1]}</th>`).join("")}<th class="num">Total ${Y}</th><th></th></tr></thead><tbody>
  ${heads.map((h, i) => { const r = blRec(h, Y) || {}; const tot = MM.reduce((s, m) => s + fnum(r["M" + m]), 0); const before = m => `${Y}-${m}` < FIN.start;
    return `<tr><td class="cname nowrap">${esc(h)}</td>${MM.map(m => `<td class="num">${before(m) ? `<span class="faint">·</span>` : `<input id="bl-${i}-${m}" class="in fin-cell" inputmode="decimal" data-fin="bl" data-h="${esc(h)}" data-y="${Y}" data-m="${m}" value="${esc(r["M" + m] || "")}">`}</td>`).join("")}
      <td class="num" id="blt-${i}"><b>${moneyZ(tot, 0)}</b></td><td class="nowrap"><button class="btn sm ghost" title="Copy the first amount to every later month" data-act="finExpFill" data-h="${esc(h)}" data-y="${Y}">Fill →</button></td></tr>`; }).join("")}
  </tbody><tfoot><tr class="tot"><td>Total outflow budget</td>${MM.map(m => `<td class="num" id="blc-${m}">${moneyZ(colTot(m), 0)}</td>`).join("")}<td class="num" id="blg">${money(MM.reduce((s, m) => s + colTot(m), 0), 0)}</td><td></td></tr></tfoot></table></div>
  <div class="card-b small muted">Expense heads come from <code>config.js</code> (<i>expenseHeads</i>); heads added here or used in the cash book are listed too. Budget months before ${ymLabel(FIN.start)} are not tracked.</div></div>`;
}
function finExpRefresh(){ const Y = state.ff.year; const heads = finHeads().filter(h => h !== UNCLASSIFIED || blRec(h, Y)); const set = (id, v) => { const el = document.getElementById(id); if(el) el.innerHTML = v; };
  let g = 0; heads.forEach((h, i) => { const r = blRec(h, Y) || {}; set(`blt-${i}`, `<b>${moneyZ(MM.reduce((s, m) => s + fnum(r["M" + m]), 0), 0)}</b>`); });
  MM.forEach(m => { const t = heads.reduce((s, h) => s + fnum((blRec(h, Y) || {})["M" + m]), 0); g += t; set(`blc-${m}`, moneyZ(t, 0)); }); set("blg", money(g, 0)); }

/* ---------- saving (serialised per record so fast typing never creates duplicates) ---------- */
const finQ = {};
function finQueue(key, fn){ const p = (finQ[key] || Promise.resolve()).then(fn, fn); finQ[key] = p.catch(() => {}); return p; }
function blSave(head, year, patch){
  return finQueue(`bl|${lc(head)}|${year}`, async () => { const r = blRec(head, year);
    await saveRec("blines", r ? r.id : null, Object.assign(r ? {} : { Title: head, Kind: "Expense", Head: head, Year: String(year) }, patch, { UpdatedBy: me.email, UpdatedOn: nowISO() })); }); }
function obSave(v){ return finQueue("ob", async () => { const r = openingRec(); await saveRec("blines", r ? r.id : null, Object.assign(r ? {} : { Title: "Opening cash & bank", Kind: "Opening", Head: "Opening cash & bank", Year: FIN.start.slice(0, 4) }, { M01: v, UpdatedBy: me.email, UpdatedOn: nowISO() })); }); }
document.addEventListener("change", e => { const t = e.target; if(t.dataset && t.dataset.act === "finTermsPick"){ const h = document.getElementById("finDueHint"); if(h) h.textContent = dueRuleText(t.value); } });
async function vatRegSave(v){ if(!canFin()) return; await finQueue("vatreg", async () => { const r = vatRegRec();
  await saveRec("blines", r ? r.id : null, Object.assign(r ? {} : { Title: "VAT registered from", Kind: "Setting", Head: "VATRegisteredFrom", Year: "" }, { M01: v, UpdatedBy: me.email, UpdatedOn: nowISO() })); });
  render(); toast(v ? `VAT registered from ${ymLabel(v)} — cash flow now includes VAT from that month` : "Set as not VAT registered — no VAT in the cash flow"); }
document.addEventListener("change", e => { const t = e.target; if(t.id !== "fin-vatreg") return; const v = t.value; if(v && v < FIN.start) return toast(`Pick ${ymLabel(FIN.start)} or later`, true);
  if(!v) return vatRegSave("");
  openModal("confirm", { text: `Treat Vinpro Global Services WLL as <b>VAT registered from ${ymLabel(v)}</b>?<br><br><span class="small muted">VAT at ${vatPct()} will be added to standard-rated fee lines billed from that month, and worked out on receipts dated from then. You can change or clear this at any time.</span>`, onYes: () => vatRegSave(v) });
  t.value = vatFrom(); });
document.addEventListener("change", async e => {
  const t = e.target; const k = t.dataset && t.dataset.fin; if(!k || !canFin()) return;
  const raw = String(t.value || "").trim(); const v = raw === "" ? "" : (k === "chk" || k === "ob") ? String(r3(fnum(raw))) : r3s(fnum(raw)); /* a balance of 0 is a real balance, not blank */ if(raw !== "" && !isFinite(parseFloat(raw.replace(/[,\s]/g, "")))){ toast("Enter a number", true); return; }
  t.value = v;
  try {
    if(k === "bl"){ const { h, y, m } = t.dataset; const r = blRec(h, y); if(r && String(r["M" + m] || "") === v) return; await blSave(h, y, { ["M" + m]: v }); finExpRefresh(); }
    if(k === "ob"){ await obSave(v); }
    if(k === "mexp"){ const { h, m } = t.dataset; const r = mtotRec(h, m); if((r ? r3s(fnum(r.Amount)) : "") === (fnum(v) ? r3s(fnum(v)) : "")) return; await mtotSave(h, m, v); setTimeout(render, 0); }
    if(k === "chk"){ const { h, y, m } = t.dataset; const r = chkRec(h, y); if(r && String(r["M" + m] || "") === v) return; await chkSave(h, y, { ["M" + m]: v }); setTimeout(render, 0); }
  } catch(err){ console.error(err); }
});

  </div><div class="mf"><button type="button" class="btn" data-act="close">Close</button></div></div>`;

  bootScreen("Connecting to the Client Desk…");
  try {
    store = new GraphStore(msalApp, account); await store.init();
    if(store.missing.length && store.missing.length < Object.keys(SCHEMA).length && (CFG.adminEmails || []).map(lc).includes(me.email)){
      bootScreen("Updating the Client Desk…");
      await store.provision();
    }
    if(store.missing.length && store.missing.length === Object.keys(SCHEMA).length){
      if(!(CFG.adminEmails || []).map(lc).includes(me.email)) return errorScreen("Not set up yet", "The Client Desk lists haven't been created on SharePoint yet. Ask the administrator to sign in once to complete setup.");
      $("#app").innerHTML = `<div class="center-screen"><div class="login">${logoImg()}<h1>First-time setup</h1><p>Create the ${store.missing.length} SharePoint lists the Client Desk needs on<br><b>${esc(store.siteUrl)}</b>?</p><button class="btn pri" id="prov">Create lists</button><p class="small muted" id="provMsg"></p></div></div>`;
      await new Promise(resolve => { $("#prov").onclick = async () => { $("#prov").disabled = true; try { await store.provision(n => $("#provMsg").textContent = "Creating " + n + "…"); resolve(); } catch(e){ errorScreen("Setup failed", e.message); } }; });
    }
    try { await store.ensureColumns(); } catch(e){ console.warn("Column check failed", e); }
    data = await store.loadAll();
    me.role = roleOf(me.email);
    if(me.role === "Admin" && !data.employees.some(e => lc(e.Email) === me.email)){
      const r = await store.create("employees", { Title: me.name, Email: me.email, Role: "Admin", Active: "Yes" }); data.employees.push(r);
    }
    render();
    if(me.role && store.listIds && store.listIds.other){ (async () => { let n = 0; for(const c of data.clients) if(canSee(c)) { try { n += await syncOthers(c, true); } catch(e){ break; } } if(n){ render(); } })(); }
  } catch(e){ console.error(e); errorScreen("Couldn't load data", e.message); }
}
start().catch(e => { console.error(e); errorScreen("Something went wrong", e.message || String(e)); });
</script>
</body>
</html>
