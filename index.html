<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinpro Client Desk</title>
<meta name="description" content="Client master, portal logins, VAT and audit tracker for Vinpro Global Services WLL, Bahrain">
<link rel="icon" type="image/png" href="https://vinproglobal.com/favicon.png">
<link rel="apple-touch-icon" href="https://vinproglobal.com/favicon.png">
<style>
:root{
  --bg:#f6f7f4; --panel:#ffffff; --panel-2:#f7f8f6; --ink:#0a1a3d; --muted:#4f5b73; --faint:#8a93a3; --line:#e2e5e9; --line-2:#eef0f2;
  --brand:#050c42; --brand-ink:#ffffff; --brand-soft:#e0f2f0; --accent:#009e95; --accent-ink:#00756e; --paper:#fcfcf9; --navy:#050c42; --teal:#009e95;
  --ok:#17804a; --ok-bg:#e5f5ec; --warn:#a15c00; --warn-bg:#fdf1de; --bad:#b83227; --bad-bg:#fbe7e5;
  --info:#2359a8; --info-bg:#e6effb; --pur:#6a3fb5; --pur-bg:#efe8fa; --grey:#56637a; --grey-bg:#edf0f5;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --radius:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080d26; --panel:#0f1636; --panel-2:#141c42; --ink:#e8ecf5; --muted:#a4acc4; --faint:#717a98; --line:#252e58; --line-2:#1b2349;
    --brand:#2fbfb4; --brand-ink:#04121a; --brand-soft:#11393c; --accent:#2fbfb4; --accent-ink:#62d6cd;
    --ok:#5cc98f; --ok-bg:#15301f; --warn:#e6a64a; --warn-bg:#35270f; --bad:#f07a6e; --bad-bg:#3a1a17;
    --info:#7fb0f0; --info-bg:#172a45; --pur:#b69af0; --pur-bg:#2a2042; --grey:#aab4c5; --grey-bg:#252e3c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080d26; --panel:#0f1636; --panel-2:#141c42; --ink:#e8ecf5; --muted:#a4acc4; --faint:#717a98; --line:#252e58; --line-2:#1b2349;
  --brand:#2fbfb4; --brand-ink:#04121a; --brand-soft:#11393c; --accent:#2fbfb4; --accent-ink:#62d6cd;
  --ok:#5cc98f; --ok-bg:#15301f; --warn:#e6a64a; --warn-bg:#35270f; --bad:#f07a6e; --bad-bg:#3a1a17;
  --info:#7fb0f0; --info-bg:#172a45; --pur:#b69af0; --pur-bg:#2a2042; --grey:#aab4c5; --grey-bg:#252e3c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",serif;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
/* Title Case on all headings, labels, buttons, menus and table headers (not on typed data) */
h1,h2,h3,h4,.nav,.btn,.seg button,.tabs button,.kpi .l,.kpi .s,.chip,.form label,.form .lbl,.toolbar select,.toolbar .in::placeholder,.tbl th,.card-h,.modal-h,.pill,.ttl{text-transform:capitalize}
.form label .in,.form label textarea,.form label input{text-transform:none}
a{color:var(--accent-ink)}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:8px;padding:2px 8px 18px;margin-bottom:6px;border-bottom:1px solid var(--line-2)}
.brand-logo{height:40px;width:auto;display:block}
.logo-chip{display:inline-flex;align-self:flex-start;border-radius:8px}
.brand b{display:block;font-family:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",serif;font-weight:400;font-size:22px;line-height:1.1;letter-spacing:.1px}
.brand small{color:var(--accent-ink);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.wordmark{display:inline-flex;align-items:baseline;font-family:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",serif;font-weight:700;font-size:24px;letter-spacing:.06em;color:var(--navy)}
.wordmark i{font-style:normal;color:var(--teal)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);cursor:pointer;border:0;background:none;text-align:left;width:100%;font-weight:500}
.nav:hover{background:var(--panel-2);color:var(--ink)}
.nav.on{background:var(--brand-soft);color:var(--accent-ink);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;line-height:18px}
.side .spacer{flex:1}
.side .me{border-top:1px solid var(--line);padding:12px 8px 0;font-size:12.5px}
.side .me b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font-family:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",serif;font-size:27px;line-height:1.1;margin:0;font-weight:400;letter-spacing:.1px}
.top .sub{color:var(--muted);font-size:12.5px}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:22px 28px 60px;max-width:1500px;width:100%}
.demo-bar{background:var(--warn-bg);color:var(--warn);padding:7px 28px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-bar select{padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:550;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:550}
.kpi .v{font-size:28px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
.tbl td.cname{min-width:150px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:18px}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.card-h h3{margin:0;font-size:14.5px;font-weight:650}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:14px 16px}
.empty{color:var(--faint);padding:24px 16px;text-align:center}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.in, select.in, textarea.in{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;min-width:0}
.in:focus{outline:2px solid var(--brand-soft);border-color:var(--accent)}
.search{min-width:240px}
.tw{overflow:auto;border-radius:var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;text-transform:capitalize;letter-spacing:.1px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel-2)}
.tbl.hwrap th{white-space:normal;vertical-align:bottom;line-height:1.3}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nowrap{white-space:nowrap}
.cname{font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;line-height:18px}
.chip.green{background:var(--ok-bg);color:var(--ok)}
.chip.amber{background:var(--warn-bg);color:var(--warn)}
.chip.red{background:var(--bad-bg);color:var(--bad)}
.chip.blue{background:var(--info-bg);color:var(--info)}
.chip.purple{background:var(--pur-bg);color:var(--pur)}
.chip.grey{background:var(--grey-bg);color:var(--grey)}
.chip.outline{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:550}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{white-space:nowrap;display:inline-block;font-size:11px;font-weight:650;padding:1px 6px;border-radius:5px;background:var(--brand-soft);color:var(--brand);margin:1px 2px 1px 0}
.avs{display:flex;flex-wrap:wrap;gap:4px}
.av{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:1px 8px 1px 2px;white-space:nowrap}
.av i{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;font-size:9.5px;font-weight:700;display:grid;place-items:center}
.over{color:var(--bad);font-weight:600}
/* ---------- management dashboard ---------- */
.hero{position:relative;overflow:hidden;border-radius:16px;padding:22px 26px;margin-bottom:18px;color:#fcfcf9;background:linear-gradient(120deg,#050c42 0%,#0a1f5c 55%,#00756e 120%);display:flex;align-items:center;gap:24px;flex-wrap:wrap;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(47,191,180,.35),transparent 70%)}
.hero .hi{flex:1;min-width:220px;position:relative;z-index:1}
.hero .hi h2{margin:0;font-weight:400;font-size:26px;line-height:1.15}
.hero .hi .d{opacity:.75;font-size:13px;margin-top:4px}
.hero .facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.hero .facts div{font-size:12px;opacity:.85}.hero .facts b{display:block;font-size:22px;font-weight:700;opacity:1;font-variant-numeric:tabular-nums}
.hero .facts .red b{color:#ffb4ab}
.ring{position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring .rt{font-size:12px;opacity:.85;max-width:120px;line-height:1.35}
.ring .rv{position:absolute;left:0;top:0;width:92px;height:92px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.kpi2{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 13px;box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .12s,box-shadow .12s}
.kpi2:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,24,40,.06),0 10px 24px rgba(16,24,40,.1)}
.kpi2 .l{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:capitalize}
.kpi2 .v{font-size:30px;font-weight:700;margin:2px 0 8px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi2 .v small{font-size:12px;font-weight:500;color:var(--faint);margin-left:4px}
.segbar{display:flex;gap:2px;height:7px;border-radius:4px;overflow:hidden;background:var(--grey-bg)}
.segbar i{display:block;height:100%}.segbar .ok{background:var(--ok)}.segbar .wa{background:var(--warn)}.segbar .ba{background:var(--bad)}
.kpi2 .s{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}
.kpi2 .s .o{color:var(--bad);font-weight:600}
.cal{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.cal th{font-size:12px;font-weight:600;color:var(--muted);padding:9px 4px;text-align:center;border-bottom:1px solid var(--line);background:var(--panel-2);position:sticky;top:0;z-index:2}
.cal th.rl{text-align:left;padding-left:16px;width:210px}
.cal th.cur{color:var(--accent-ink);box-shadow:inset 0 -2px 0 var(--accent)}
.cal td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line-2);height:42px}
.cal td.rl{text-align:left;padding-left:16px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal td.rl small{display:block;font-weight:400;color:var(--faint);font-size:11px}
.cal td.nil{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line-2) 6px 7px)}
.cal td.curc{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.cal tr:hover td.rl{color:var(--accent-ink)}
.dl{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:46px;height:28px;padding:0 7px;border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;border:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.ok{background:var(--ok-bg);color:var(--ok)}.dl.wa{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}.dl.ba{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}.dl.fu{background:var(--grey-bg);color:var(--grey)}
.dl:hover{filter:brightness(.96);transform:scale(1.04)}
.cgrid{max-height:540px;overflow:auto}
.cgrid .dl{min-width:40px;height:24px;font-size:10.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.yrnav{display:inline-flex;align-items:center;gap:6px}.yrnav b{font-size:14px;min-width:42px;text-align:center}
details.dash-more{margin-top:6px}
.mgr-row{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-bottom:18px}
.mgr-row .card{margin:0}
details.dash-more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-weight:600;margin-bottom:14px;background:var(--panel)}
details.dash-more>summary::-webkit-details-marker{display:none}
details.dash-more[open]>summary{border-style:solid}
.tbl tr.grp td{background:var(--panel-2);padding-top:7px;padding-bottom:7px}
.soon{color:var(--warn);font-weight:600}
.bar{height:6px;background:var(--line-2);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.progress-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.progress-row .bar{flex:1;min-width:160px;height:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:550;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--warn-bg);color:var(--ink);padding:10px 14px;border-radius:8px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{border-left-color:var(--info);background:var(--info-bg)}
.banner.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.ygrid td.cell{text-align:center;padding:5px 4px;min-width:58px}
.ygrid .yc{display:inline-block;min-width:50px;padding:3px 6px;border-radius:6px;font-size:11.5px;font-weight:650;cursor:pointer;border:1px solid transparent}
.ygrid .yc.overdue{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.ygrid .yc.future{opacity:.55}
.ygrid th.m{text-align:center}
.ygrid td.off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line-2) 6px 7px)}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:9px 16px;border-bottom:1px solid var(--line-2);font-size:13px}
.feed li:last-child{border-bottom:0}
.feed .when{color:var(--faint);font-size:11.5px}
/* modal */
.mwrap{position:fixed;inset:0;background:rgba(10,18,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:50}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:640px;border:1px solid var(--line)}
.modal.wide{max-width:1040px}
.modal.ro [data-act=editCred],.modal.ro [data-act=delCred],.modal.ro [data-act=editVat],.modal.ro [data-act=editCt],.modal.ro [data-act=editAudit]{display:none}
.modal.ro [data-act=editMw]{pointer-events:none}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:17px}
.modal .mh .x{margin-left:auto}
.modal .mb{padding:18px 20px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel-2);border-radius:0 0 14px 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.form label,.form .lbl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.form label .in{font-weight:400;color:var(--ink);width:100%}
.form .hint{font-weight:400;font-size:11.5px;color:var(--faint)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.checks label{flex-direction:row;align-items:center;gap:7px;font-weight:500;color:var(--ink)}
.svc{display:flex;flex-wrap:wrap;gap:8px}
.svc label{flex-direction:row!important;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;color:var(--ink)!important;font-weight:550!important;background:var(--panel)}
.svc label:has(input:checked){background:var(--brand-soft);border-color:var(--brand);color:var(--brand)!important}
.svc input{accent-color:var(--brand);margin:0}
.tag.svc-tag{background:var(--ok-bg);color:var(--ok)}
.tag.loc-UAE{background:var(--pur-bg);color:var(--pur)}
.tag.loc-Bahrain{background:var(--info-bg);color:var(--info)}
.locsw button{padding:5px 12px}
tr.click-row{cursor:pointer}
tr.click-row:hover td{background:var(--panel-2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 18px}
.kv div span{display:block;font-size:12px;color:var(--faint);font-weight:600;text-transform:capitalize}
.kv div b{font-weight:550;word-break:break-word}
.secret{font-family:ui-monospace,Consolas,monospace;letter-spacing:.3px}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);padding:3px;border-radius:5px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.icon-btn svg{width:15px;height:15px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:99;font-weight:550;max-width:90vw}
.toast.err{background:var(--bad);color:#fff}
.center-screen{min-height:100vh;display:grid;place-items:center;padding:16px}
.login{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:34px;max-width:420px;width:100%;text-align:center}
.login .brand-logo{height:56px;margin:0 auto 16px}
.login h1{font-family:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",serif;font-weight:400;font-size:30px;margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 22px}
.ms-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-weight:600;font-size:14.5px}
.ms-btn:hover{border-color:var(--faint)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- branded sign-in & loading (styled after vinproglobal.com) ---------- */
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--teal)}
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);background:var(--paper)}
.auth-hero{background:var(--navy);color:#eef1f8;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative;overflow:hidden}
.auth-hero::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:1px solid rgba(0,158,149,.35);box-shadow:0 0 0 60px rgba(0,158,149,.05),0 0 0 140px rgba(0,158,149,.035)}
.auth-hero h1{font-family:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",serif;font-weight:400;font-size:clamp(44px,5.4vw,72px);line-height:1.02;margin:18px 0 18px;letter-spacing:-.01em;color:#fcfcf9;text-wrap:balance}
.auth-hero h1 em{font-style:italic;color:#9fdcd6}
.auth-hero p{font-size:16px;line-height:1.6;color:#c9cfe0;max-width:46ch;margin:0}
.auth-list{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:10px;font-size:14px;color:#dfe4f0}
.auth-list li{display:flex;gap:10px;align-items:center}
.auth-list li::before{content:"";width:16px;height:9px;border-left:2px solid var(--teal);border-bottom:2px solid var(--teal);transform:rotate(-45deg) translateY(-3px);flex:none}
.auth-foot{font-size:12.5px;color:#9aa3bf;position:relative;z-index:1}
.auth-foot a{color:#9fdcd6;text-decoration:none}
.auth-panel{display:grid;place-items:center;padding:40px 24px;background:var(--paper)}
.auth-card{width:100%;max-width:380px}
.auth-card .brand-logo{height:64px;margin-bottom:34px}
.auth-card h2{font-family:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",serif;font-weight:400;font-size:36px;line-height:1.1;margin:10px 0 8px;color:#0a1a3d}
.auth-card p{color:#4f5b73;margin:0 0 28px;line-height:1.55}
.ms-btn.navy{background:var(--navy);color:#fcfcf9;border-color:var(--navy);padding:13px;font-size:15px;border-radius:10px}
.ms-btn.navy:hover{filter:brightness(1.25)}
.ms-btn.navy .ms-ic{background:#fff;border-radius:4px;padding:3px;display:grid;place-items:center}
.auth-note{font-size:12.5px;color:#8a93a3;margin-top:18px}
.auth-card .banner{text-align:left;margin-top:16px}
.boot{min-height:100vh;display:grid;place-items:center;background:var(--paper);padding:16px;text-align:center}
.boot .brand-logo{height:64px;margin:0 auto 26px;animation:breathe 1.8s ease-in-out infinite}
.boot-bar{width:180px;height:3px;border-radius:3px;background:rgba(5,12,66,.08);overflow:hidden;margin:0 auto 14px}
.boot-bar i{display:block;width:40%;height:100%;background:var(--teal);border-radius:3px;animation:slide 1.2s ease-in-out infinite}
.boot-msg{font-size:13px;color:#4f5b73;letter-spacing:.02em}
@keyframes breathe{50%{opacity:.72}}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion: reduce){.boot .brand-logo,.boot-bar i{animation:none}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .side .logo-chip{background:#fcfcf9;padding:6px 8px}}
:root[data-theme="dark"] .side .logo-chip{background:#fcfcf9;padding:6px 8px}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth-hero{padding:36px 24px}.auth-hero::after{display:none}.auth-list{display:none}.auth-panel{padding:36px 20px 48px}}
.busy{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--accent));z-index:100;animation:bz 1s ease-in-out infinite alternate}
@keyframes bz{from{opacity:.4}to{opacity:1}}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--ok)}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .tbl td.cname{min-width:120px}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:2px}
  .brand,.side .spacer,.side .me{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 10px}
  .top{padding:12px 16px;flex-wrap:wrap}
  .top .right{margin-left:0;width:100%;justify-content:space-between}
  .content{padding:16px 16px 50px}
  .demo-bar{padding:7px 16px}
  .form{grid-template-columns:1fr}
  .search{min-width:0;flex:1}
  .kpi .v{font-size:24px}
}

/* =================== THEME REFRESH (whole tool) =================== */
:root{--vg-done:#050c42;--vg-done-bg:#e3e6f3;--vg-due:#009e95;--vg-due-bg:#dff3f1;--vg-over:#d0453d;--vg-over-bg:#fbe5e3;--vg-fut:#dfe4ec;--vg-fut-ink:#56637a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--vg-done:#8fa2ff;--vg-done-bg:#1f2a5c;--vg-due:#2fbfb4;--vg-due-bg:#10393a;--vg-over:#f07a6e;--vg-over-bg:#3a1a17;--vg-fut:#2a3350;--vg-fut-ink:#aab4c5}}
:root[data-theme="dark"]{--vg-done:#8fa2ff;--vg-done-bg:#1f2a5c;--vg-due:#2fbfb4;--vg-due-bg:#10393a;--vg-over:#f07a6e;--vg-over-bg:#3a1a17;--vg-fut:#2a3350;--vg-fut-ink:#aab4c5}
.dl.ok{background:var(--vg-done-bg)!important;color:var(--vg-done)!important}.dl.wa{background:var(--vg-due-bg)!important;color:var(--vg-due)!important;box-shadow:inset 0 0 0 1.5px var(--vg-due)!important}
.dl.ba{background:var(--vg-over-bg)!important;color:var(--vg-over)!important;box-shadow:inset 0 0 0 1.5px var(--vg-over)!important}.dl.fu{background:var(--vg-fut)!important;color:var(--vg-fut-ink)!important}
.chip.st-done{background:var(--vg-done-bg);color:var(--vg-done)}.chip.st-pend{background:var(--vg-due-bg);color:var(--vg-due)}
.steps i.on{background:var(--vg-done)!important}.bar i{background:var(--vg-done)!important}
.segbar .ok{background:var(--vg-done)}.segbar .wa{background:var(--vg-due)}.segbar .ba{background:var(--vg-over)}
body{background:radial-gradient(1200px 500px at 100% -10%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 60%),var(--bg)}
/* sidebar */
.side{background:linear-gradient(180deg,#050c42 0%,#0a1a52 60%,#08304f 100%);border-right:0;color:#e9edf7;padding:20px 14px}
.side .brand{border-bottom:1px solid rgba(255,255,255,.1)}
.side .brand-logo{background:#fff;border-radius:12px;padding:6px 10px;height:46px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.side .brand b{color:#fff}.side .brand small{color:#5fd6cc}
.side .wordmark{color:#fff}
.side .nav{color:rgba(233,237,247,.72);border-radius:10px;padding:10px 12px;position:relative;transition:background .15s,color .15s}
.side .nav:hover{background:rgba(255,255,255,.07);color:#fff}
.side .nav.on{background:linear-gradient(90deg,rgba(47,191,180,.28),rgba(47,191,180,.08));color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #2fbfb4}
.side .nav.on svg{color:#5fd6cc}
.side .me{border-top:1px solid rgba(255,255,255,.1);color:rgba(233,237,247,.7)}.side .me b{color:#fff}
.side .me a,.side .me .btn{color:#fff}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line-2)}
.top h1{font-size:29px}
/* surfaces */
.card{border-radius:16px;border-color:var(--line-2);box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06)}
.card-h{padding:14px 18px}.card-h h3{font-size:15.5px;font-weight:700;letter-spacing:.1px}
.card-b{padding:16px 18px}
/* tables */
.tbl th{background:color-mix(in srgb,var(--panel-2) 80%,var(--brand-soft));font-size:12px;color:var(--muted);padding:10px 14px}
.tbl td{padding:11px 14px}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,var(--panel))}
.tbl tbody tr:last-child td{border-bottom:0}
/* controls */
.btn{border-radius:10px;padding:8px 14px;transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(16,24,40,.08)}
.btn.pri{background:linear-gradient(135deg,#050c42,#0b2a6b);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(5,12,66,.25)}
.btn.pri:hover{transform:translateY(-1px);filter:none;box-shadow:0 8px 20px rgba(5,12,66,.3)}
.btn.sm{border-radius:8px;padding:5px 10px}
.in, select.in, textarea.in{border-radius:10px;padding:8px 12px;border-color:var(--line);transition:border-color .12s,box-shadow .12s}
.in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.seg{border-radius:12px;padding:3px;gap:2px;background:var(--panel-2);border-color:var(--line-2)}
.seg button{border-radius:9px;padding:6px 14px}
.seg button.on{background:linear-gradient(135deg,#050c42,#0b2a6b);color:#fff;box-shadow:0 2px 8px rgba(5,12,66,.25)}
.chip{border-radius:999px;padding:3px 10px}
.tag{border-radius:6px;padding:2px 7px}
.banner{border-radius:12px;border-left-width:5px}
.bar{height:8px;border-radius:6px}.bar i{background:linear-gradient(90deg,var(--accent),var(--ok));border-radius:6px}
.steps i{height:6px;border-radius:4px}.steps i.on{background:linear-gradient(90deg,var(--accent),var(--ok))}
/* year grids in every tracker: same deadline chips as the dashboard */
.ygrid td.cell{padding:6px 4px}
.ygrid .yc{min-width:48px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font-size:11px;font-weight:700;transition:transform .12s}
.ygrid .yc:hover{transform:scale(1.06)}
.ygrid .yc.overdue{background:var(--bad-bg)!important;color:var(--bad)!important;border-color:transparent;box-shadow:inset 0 0 0 1.5px var(--bad)}
.ygrid .yc.overdue:before{content:"! "}
.ygrid .yc.future{opacity:1;background:var(--grey-bg)!important;color:var(--grey)!important}
.ygrid td.off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line-2) 6px 7px)}
/* modals */
.mwrap{background:rgba(5,12,40,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{border-radius:20px;border-color:var(--line-2);box-shadow:0 30px 80px rgba(5,12,40,.35);overflow:hidden}
.modal .mh{background:linear-gradient(120deg,color-mix(in srgb,var(--brand-soft) 70%,var(--panel)),var(--panel));padding:18px 22px}
.modal .mh h2{font-size:18px;font-weight:700}
.modal .mf{border-radius:0}
.tabs button{border-radius:8px 8px 0 0}.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
/* tracker headline strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.strip .st{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05)}
.strip .st .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.strip .st b{display:block;font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums}
.strip .st span{font-size:12px;color:var(--muted)}
.strip .ba .ic{background:var(--vg-over-bg);color:var(--vg-over)}.strip .wa .ic{background:var(--vg-due-bg);color:var(--vg-due)}.strip .ok .ic{background:var(--vg-done-bg);color:var(--vg-done)}.strip .fu .ic{background:var(--vg-fut);color:var(--vg-fut-ink)}
.side .me *{color:rgba(233,237,247,.75)!important}.side .me b{color:#fff!important}
.tbl th.sortable{cursor:pointer;user-select:none}.tbl th.sortable:hover{color:var(--ink)}.tbl th .sarr{margin-left:5px;font-size:10px;opacity:.45}.tbl th.sorted{color:var(--accent-ink)}.tbl th.sorted .sarr{opacity:1}
.wl{display:flex;flex-direction:column;gap:6px}
.form .wl .lbl{display:block}
.wl-list{max-height:280px;overflow:auto;border:1px solid var(--line-2);border-radius:12px;background:var(--panel-2);padding:4px 0}
.wl-e{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line-2)}.wl-e:last-child{border-bottom:0}
.wl-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#050c42,#0b2a6b);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.wl-e.sys .wl-av{background:var(--grey-bg);color:var(--grey)}
.wl-h{font-size:12px;color:var(--faint)}.wl-h b{color:var(--ink);font-weight:650}
.wl-t{white-space:pre-wrap;font-size:13.5px;color:var(--ink);margin-top:2px;overflow-wrap:anywhere}
.wl-e.sys .wl-t{color:var(--muted);font-size:12.5px}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.donut-card{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;padding:14px 16px 12px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,box-shadow .12s}
.donut-card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,24,40,.06),0 12px 28px rgba(16,24,40,.1)}
.dc-h b{display:block;font-size:14px}.dc-h span{font-size:12px;color:var(--faint)}
.dc-ring{position:relative;align-self:center;width:112px;height:112px;margin:4px 0}
.dc-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.dc-c b{font-size:22px;font-variant-numeric:tabular-nums}.dc-c span{font-size:11px;color:var(--faint)}
.dc-cap{font-size:12px;color:var(--muted);text-align:center;min-height:16px}.dc-cap.bad{color:var(--bad);font-weight:600}.dc-cap.ok{color:var(--ok);font-weight:600}
.chart-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-bottom:18px;align-items:start}.chart-row>.card{margin:0}
.chart-row:has(> :only-child){grid-template-columns:minmax(0,1fr)}
.ch-svg{width:100%;height:auto;display:block}.ch-grid{stroke:var(--line-2);stroke-width:1}.ch-ax{font-size:11px;fill:var(--faint)}.ch-ax.cur{fill:var(--accent-ink);font-weight:700}.ch-val{font-size:10.5px;fill:var(--muted);font-weight:600}
.mbar{cursor:pointer}.mbar:hover rect:not([fill=transparent]){filter:brightness(1.08)}
.ch-cap{font-size:12.5px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2)}
.ch-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}.ch-legend span{display:inline-flex;align-items:center;gap:5px}.ch-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ch-sub{font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.hb{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:10px;align-items:center;margin:7px 0}
.hb-l{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb-t{display:flex;gap:2px;height:12px;background:var(--panel-2);border-radius:6px;overflow:hidden}.hb-t i{display:block;height:100%}
.hb-v{font-size:12.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.mixbar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin-bottom:8px}.mixbar i{display:block}
ul.att{list-style:none;margin:0;padding:6px 0}ul.att li{display:flex;gap:12px;align-items:center;padding:9px 18px;cursor:pointer;border-bottom:1px solid var(--line-2)}ul.att li:last-child{border-bottom:0}ul.att li:hover{background:color-mix(in srgb,var(--bad) 5%,var(--panel))}
.att-d{min-width:46px;height:30px;border-radius:9px;background:var(--bad-bg);color:var(--bad);font-weight:800;font-size:12px;display:grid;place-items:center}
@media (max-width:1000px){.chart-row{grid-template-columns:minmax(0,1fr)}}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding:16px 18px 18px}
.sm-chart{margin:0!important;padding:12px 14px 10px;box-shadow:none!important;border:1px solid var(--line-2);border-radius:14px;background:var(--panel)}
.sm-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px}.sm-h b{display:block;font-size:14px}.sm-h span{font-size:11.5px;color:var(--faint)}
.sm-n{font-size:20px;font-weight:800;color:var(--vg-done);text-align:right;line-height:1}.sm-n span{display:block;font-size:10.5px;font-weight:500;color:var(--faint)}.sm-n.over{color:var(--vg-over)}
.sm-cap{font-size:12px;color:var(--muted);margin-top:4px}
.ch-cur{fill:color-mix(in srgb,var(--vg-done) 10%,transparent)}
.chart-row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:18px;align-items:start}.chart-row3>.card{margin:0}
.chart-row3 .ch-wide{grid-column:auto}
@media (max-width:1150px){.chart-row3{grid-template-columns:minmax(0,1fr)}}
.donut-card .dc-cap.ok{color:var(--vg-done)}.donut-card .dc-cap.bad{color:var(--vg-over)}
.steps{min-width:96px}.steps i{min-width:9px}
.tbl td.cname{min-width:190px}
@media (max-width:760px){.side{background:linear-gradient(90deg,#050c42,#0a1a52)}.side .nav.on{box-shadow:inset 0 -3px 0 #2fbfb4}.top{position:static}}

/* ---------- Budget vs Actual ---------- */
.fin-tabs{padding:0;margin:-4px 0 16px}
.tbl.fin th.grp{text-align:center;border-bottom:1px solid var(--line);color:var(--ink)}
.tbl.fin .sep{border-left:2px solid var(--line)}
.tbl.fin tr.sec td{background:var(--panel-2);font-weight:700;color:var(--accent-ink);letter-spacing:.02em}
.tbl.fin tr.tot td,.tbl tfoot tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.tbl.fin tr.net td{background:var(--brand-soft)}
.tbl.fin tr.sub td{color:var(--muted);font-size:12.5px}
.tbl.fin tr.sub td:first-child,.tbl.fin td.ind{padding-left:26px}
.tbl.fin td a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--faint)}
.tbl.fin td a:hover{color:var(--accent-ink)}
.fav{color:var(--ok)} .adv{color:var(--bad)}
.fin-grid th,.fin-grid td{white-space:nowrap;padding-top:4px;padding-bottom:4px}
.fin-grid tr.lhead td{font-weight:650;padding-top:10px;border-bottom:0}
.fin-grid tr.bud td,.fin-grid tr.var td{font-size:12.5px}
.fin-grid tr.bud td:first-child,.fin-grid tr.act td:first-child,.fin-grid tr.var td:first-child{color:var(--muted)}
.fin-grid th.curm{color:var(--accent-ink)}
.fin-cell{width:64px!important;min-width:0!important;text-align:right;padding:5px 5px!important;font-variant-numeric:tabular-nums}
.fin-exp td{padding:4px 4px}
.fin-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-top:16px}.fin-charts .card{margin:0}
.fchart svg{width:100%;height:auto;display:block}
.fchart .gl{stroke:var(--line);stroke-width:1}
.fchart .ax{fill:var(--faint);font-size:10px;font-family:inherit}

function cleanFields(kind, f){
  const out = {}; for(const k of Object.keys(SCHEMA[kind].fields)) if(k in f) out[k] = f[k] == null ? "" : String(f[k]);
  return out;
}

class GraphStore {
  constructor(app, account){ this.app = app; this.account = account; this.listIds = {}; this.missing = []; }
  async token(){
    const req = { scopes: SCOPES, account: this.account };
    try { return (await this.app.acquireTokenSilent(req)).accessToken; }
    catch(e){ if(e instanceof msal.InteractionRequiredAuthError){ await this.app.acquireTokenRedirect(req); } throw e; }
  }
  async g(method, path, body){
    const t = await this.token();
    const url = path.startsWith("http") ? path : "https://graph.microsoft.com/v1.0" + path;
    for(let attempt = 0; attempt < 4; attempt++){
      const r = await fetch(url, { method, headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
      if(r.status === 429 || r.status === 503){ const wait = (+r.headers.get("Retry-After") || 2) * 1000; await new Promise(res => setTimeout(res, wait)); continue; }
      if(r.status === 204) return null;
      const j = await r.json().catch(() => ({}));
      if(!r.ok) throw new Error((j.error && j.error.message) || `${r.status} ${r.statusText}`);
      return j;
    }
    throw new Error("Microsoft Graph is busy (throttled). Please retry in a minute.");
  }
  async init(){
    const site = await this.g("GET", `/sites/${CFG.sharePointHost}:${CFG.sitePath}`);
    this.siteId = site.id; this.siteUrl = site.webUrl;
    const lists = await this.g("GET", `/sites/${this.siteId}/lists?$select=id,displayName&$top=500`);
    for(const k in SCHEMA){ const l = lists.value.find(x => x.displayName === CFG.listPrefix + SCHEMA[k].list); if(l) this.listIds[k] = l.id; }
    this.missing = Object.keys(SCHEMA).filter(k => !this.listIds[k]);
  }
  async provision(onStep){
    for(const k of [...this.missing]){
      const columns = Object.entries(SCHEMA[k].fields).filter(([n]) => n !== "Title")
        .map(([name, t]) => ({ name, text: t === "note" ? { allowMultipleLines: true, linesForEditing: 6 } : {} }));
      onStep && onStep(CFG.listPrefix + SCHEMA[k].list);
      const l = await this.g("POST", `/sites/${this.siteId}/lists`, { displayName: CFG.listPrefix + SCHEMA[k].list, columns, list: { template: "genericList" } });
      this.listIds[k] = l.id;
    }
    this.missing = [];
  }
  /* SharePoint may store a column under a different internal name than the one requested
     (e.g. names that look like Excel cell references such as "M01"), so map each field to
     the list's real internal name, matched by name first and then by display name. */
  async ensureColumns(){
    this.cols = this.cols || {};
    for(const k of Object.keys(SCHEMA)){ const lid = this.listIds[k]; if(!lid) continue;
      try {
        const cols = (await this.g("GET", `/sites/${this.siteId}/lists/${lid}/columns?$select=name,displayName&$top=500`)).value; const map = {};
        const find = n => (cols.find(c => c.name === n) || cols.find(c => lc(c.displayName) === lc(n)) || {}).name;
        for(const [name, t] of Object.entries(SCHEMA[k].fields)){ let real = name === "Title" ? "Title" : find(name);
          if(!real){ const c = await this.g("POST", `/sites/${this.siteId}/lists/${lid}/columns`, { name, text: t === "note" ? { allowMultipleLines: true, linesForEditing: 6 } : {} }); real = c.name || name; cols.push(c); }
          map[name] = real; }
        this.cols[k] = map;
      } catch(e){ console.warn("Column check failed for", k, e); } }
  }
  col(kind, name){ return (this.cols && this.cols[kind] && this.cols[kind][name]) || name; }
  toSP(kind, f){ const o = {}; for(const k in f) o[this.col(kind, k)] = f[k]; return o; }
  norm(kind, it){ const r = { id: String(it.id) }; const f = it.fields || {}; for(const k of Object.keys(SCHEMA[kind].fields)){ const v = f[this.col(kind, k)]; r[k] = v == null ? "" : String(v); } return r; }
  async loadAll(){
    const out = {};
    await Promise.all(Object.keys(SCHEMA).map(async kind => {
      if(!this.listIds[kind]){ out[kind] = []; return; }
      let url = `/sites/${this.siteId}/lists/${this.listIds[kind]}/items?$expand=fields&$top=999`; const rows = []; let guard = 0;
      try { while(url && guard++ < 60){ const j = await this.g("GET", url); for(const it of j.value) rows.push(this.norm(kind, it)); url = j["@odata.nextLink"] || null; } }
      catch(e){ if(!["fees", "blines", "cash"].includes(kind)) throw e; console.warn("Finance list not readable", kind, e); this.finDenied = true; }
      out[kind] = rows;
    }));
    return out;
  }
  needList(kind){ if(!this.listIds[kind]) throw new Error(`The ${SCHEMA[kind].list} list isn't set up on SharePoint yet. Ask the administrator to sign in once to finish the update.`); }
  async create(kind, fields){ this.needList(kind); const f = cleanFields(kind, fields); const it = await this.g("POST", `/sites/${this.siteId}/lists/${this.listIds[kind]}/items`, { fields: this.toSP(kind, f) }); return Object.assign({}, this.norm(kind, { id: it.id, fields: {} }), f); }
  async update(kind, id, fields){ this.needList(kind); await this.g("PATCH", `/sites/${this.siteId}/lists/${this.listIds[kind]}/items/${id}/fields`, this.toSP(kind, cleanFields(kind, fields))); }
  async remove(kind, id){ await this.g("DELETE", `/sites/${this.siteId}/lists/${this.listIds[kind]}/items/${id}`); }
}

  async loadAll(){
    let saved = null; try { saved = JSON.parse(localStorage.getItem("vinpro-demo") || "null"); } catch(e){}
    this.data = saved && saved.clients && saved.ct && saved.mw && saved.v === 3 ? saved : demoSeed(); if(!this.data.other) this.data.other = [];
    if(!this.data.fees || !this.data.blines || !this.data.cash){ Object.assign(this.data, finDemoSeed(this.data)); this.persist(); }
    return JSON.parse(JSON.stringify(this.data));
  }
  async create(kind, fields){ const r = Object.assign({ id: uid() }, Object.fromEntries(Object.keys(SCHEMA[kind].fields).map(k => [k, ""])), cleanFields(kind, fields)); this.data[kind].push(r); this.persist(); return { ...r }; }
  async update(kind, id, fields){ const r = this.data[kind].find(x => x.id === id); if(r) Object.assign(r, cleanFields(kind, fields)); this.persist(); }
  async remove(kind, id){ this.data[kind] = this.data[kind].filter(x => x.id !== id); this.persist(); }
  reset(){ try { localStorage.removeItem("vinpro-demo"); } catch(e){} }
}

function vatWork(clients, ym){ const out = []; const cur = ym || curYM();
  for(const c of clients){ if(isDeact(c)) continue;
    for(const pe of periodsFor(c, ymAdd(cur, -36), cur)){ const due = dueOf(pe, c); const dm = due.slice(0, 7); if(dm > cur) continue;
      const st = vatStatus(c.id, pe); const done = VAT_DONE.has(st); const isCur = dm === cur; if(!isCur && done) continue;

  return out.sort((a, b) => a.due.localeCompare(b.due) || a.c.Title.localeCompare(b.c.Title)); }
/* accounting/consultation by DUE date: work falling due this month, plus earlier work still open */
function mwDueWork(clients, ym){ const out = []; const cur = ym || curYM();
  for(const c of clients){ if(isDeact(c)) continue; for(const svc of MW_SERVICES){ if(!hasService(c, svc)) continue;
    for(const p of mwPeriods(c, svc, MW_START, cur)){ const due = mwDue(c, svc, p.ym, p.freq); const dm = due.slice(0, 7); if(dm > cur) continue;
      const st = mwStatus(c.id, svc, p.ym, p.freq); const done = MW_DONE.has(st); const isCur = dm === cur; if(!isCur && done) continue;
      out.push({ c, svc, ym: p.ym, freq: p.freq, due, st, done, cur: isCur, prev: !isCur && !done, over: !done && daysUntil(due) < 0, label: mwLabel(c, p.ym, p.freq) }); } } }

function mwWork(clients){ const out = []; const cur = curYM();
  for(const c of clients){ if(isDeact(c)) continue; for(const svc of MW_SERVICES){ if(!hasService(c, svc)) continue;
    const ps = mwPeriods(c, svc, MW_START, ymAdd(cur, 12)); const nowA = (ps.find(p => p.freq === "Annually" && p.ym >= cur) || {}).ym;
    for(const p of ps){ const isCur = p.freq === "Monthly" ? p.ym === cur : p.ym === nowA; const past = p.freq === "Monthly" ? p.ym < cur : p.ym < cur;
      if(!isCur && !past) continue; const st = mwStatus(c.id, svc, p.ym, p.freq); const done = MW_DONE.has(st); if(!isCur && done) continue;
      const due = mwDue(c, svc, p.ym, p.freq); out.push({ c, svc, ym: p.ym, freq: p.freq, due, st, done, cur: isCur, prev: !isCur && !done, over: !isCur && !done && daysUntil(due) < 0, label: mwLabel(c, p.ym, p.freq) }); } } }

function ctWork(clients){ const out = []; const t = todayISO(); const y = +t.slice(0, 4);

function deadlineCharts(items, Y){ const defs = [["VAT", "returns by filing deadline", x => x.svc === "VAT", "vat"], ["Accounting", "monthly / annual close", x => x.svc === "Accounting", "mw"], ["Consultation", "monthly / annual", x => x.svc === "Consultancy", "mw"],

    Team: c => teamOf(c).map(e => lc(empName(e))).join(", ") || "~", Logins: c => (credsBy[c.id] || []).length, Deact: c => isDeact(c) ? 1 : 0 };

VIEWS.vat = () => {
  const f = state.vf; const q = lc(f.q);
  const base = visibleClients().filter(c => c.Status !== "Deactivated" && (!q || lc(c.Title).includes(q)) && (!f.who || teamOf(c).includes(f.who)));
  const unset = base.filter(c => !c.VATCycle && hasService(c, "VAT")).length;
  const regd = Object.keys(CYCLES).filter(k => CYCLES[k].n);
  if(f.cycle == null){ const n = {}; base.forEach(c => { if(regd.includes(c.VATCycle)) n[c.VATCycle] = (n[c.VATCycle] || 0) + 1; }); f.cycle = Object.keys(n).sort((a, b) => n[b] - n[a])[0] || ""; }
  const cur = curYM();
  if(f.cycle && !isPeriodEnd(f.cycle, ymAdd(f.month, -1))){ let m = cur; while(!isPeriodEnd(f.cycle, ymAdd(m, -1))) m = ymAdd(m, 1); f.month = m; }
  const dueOpts = f.cycle
    ? Array.from({length:22}, (_, i) => ymAdd(cur, i - 16)).filter(m => m <= ymAdd(cur, CYCLES[f.cycle].n + 1) && isPeriodEnd(f.cycle, ymAdd(m, -1))).reverse().map(m => { const pe = ymAdd(m, -1); const now = m >= cur && ymAdd(m, -CYCLES[f.cycle].n) < cur;
        return `<option value="${m}" ${f.month === m ? "selected" : ""}>${periodLabel(f.cycle, pe)} · Due ${ymLabel(m)}${now ? " (Current)" : ""}</option>`; }).join("")
    : Array.from({length:19}, (_, i) => ymAdd(cur, i - 14)).reverse().map(m => `<option value="${m}" ${f.month === m ? "selected" : ""}>Due in ${ymLabel(m)}${m === cur ? " (this month)" : ""}</option>`).join("");
  const head = `<div class="toolbar">
    <div class="seg"><button class="${f.mode === "month" ? "on" : ""}" data-act="vmode" data-v="month">By filing month</button><button class="${f.mode === "year" ? "on" : ""}" data-act="vmode" data-v="year">Year overview</button></div>
    <select class="in" data-bind="vf.cycle" title="VAT cycle"><option value="">All VAT cycles</option>${regd.map(k => `<option value="${k}" ${f.cycle === k ? "selected" : ""}>${CYCLES[k].short}</option>`).join("")}</select>
    ${f.mode === "month" ? `<select class="in" data-bind="vf.month" title="Due">${dueOpts}</select>`
      : `<select class="in" data-bind="vf.year">${[0,1,2,3].map(i => new Date().getFullYear() + 1 - i).map(y => `<option ${+f.year === y ? "selected" : ""}>${y}</option>`).join("")}</select>`}
    <input id="vf-q" class="in search" placeholder="Search client…" value="${esc(f.q)}" data-bind="vf.q">
    ${isMgr() ? `<select class="in" data-bind="vf.who"><option value="">All employees</option>${activeEmployees().map(e => `<option value="${esc(lc(e.Email))}" ${f.who === lc(e.Email) ? "selected" : ""}>${esc(e.Title)}</option>`).join("")}</select>` : ""}
    ${f.mode === "month" ? `<select class="in" data-bind="vf.show"><option value="all">All statuses</option><option value="pending" ${f.show === "pending" ? "selected" : ""}>Pending only</option><option value="done" ${f.show === "done" ? "selected" : ""}>Completed only</option></select>` : ""}
  </div>
  ${unset ? `<div class="banner">${unset} VAT client${unset>1?"s have":" has"} no VAT cycle set and ${unset>1?"are":"is"} not shown. <button class="btn sm" data-act="gotoUnset">Set VAT cycles</button></div>` : ""}`;
  const shown = f.cycle ? base.filter(c => c.VATCycle === f.cycle) : base;
  return head + (f.mode === "month" ? vatMonthView(shown) : vatYearView(shown));
};
function vatMonthView(base){
  const f = state.vf; const pe = ymAdd(f.month, -1);
  let rows = base.filter(c => periodsFor(c, pe, pe).length).map(c => ({ c, st: vatStatus(c.id, pe), rec: vatRec(c.id, pe) }));
  const total = rows.length, done = rows.filter(r => VAT_DONE.has(r.st)).length;
  if(f.show === "pending") rows = rows.filter(r => !VAT_DONE.has(r.st)); if(f.show === "done") rows = rows.filter(r => VAT_DONE.has(r.st));
  const pct = total ? Math.round(done / total * 100) : 0;
  const locsHere = LOCATIONS.filter(L => base.some(c => locOf(c) === L));
  const dueLine = locsHere.map(L => { const du = dueOf(pe, { Location: L }); const dd = daysUntil(du); return `${L} (${LOC[L].auth}) ${fmtDate(du)} · <span class="${dd < 0 && done < total ? "over" : dd <= 10 ? "soon" : ""}">${relDays(dd)}</span>`; }).join(" &nbsp;|&nbsp; ");
  return `<div class="card"><div class="card-b">
    <div class="progress-row"><div><b>${state.vf.cycle ? `${esc(CYCLES[state.vf.cycle].short)} · ${periodLabel(state.vf.cycle, pe)}` : `Returns for periods ending ${ymLabel(pe)}`}</b><div class="small muted">Due: ${dueLine}</div></div>
    <div class="bar" title="${pct}% complete"><i style="width:${pct}%"></i></div><div><b>${done}</b> <span class="muted">of ${total} filed (${pct}%)</span></div></div></div>
    <div class="tw"><table class="tbl"><thead><tr><th>Client</th><th>Period</th><th>Status</th><th>Preparer</th><th>Filed on</th><th>Ack / Ref</th><th class="num">Net VAT</th><th>Last update</th><th></th></tr></thead><tbody>
    ${rows.map(r => { const late = !VAT_DONE.has(r.st) && daysUntil(dueOf(pe, r.c)) < 0; return `<tr>
      <td class="cname">${state.loc ? "" : locTag(r.c) + " "}<a href="#" data-act="openClient" data-id="${r.c.id}" style="color:inherit;text-decoration:none">${esc(r.c.Title)}</a></td>
      <td class="nowrap small">${periodLabel(r.c.VATCycle, pe)}</td>
      <td>${vatChip(r.st)}${late ? ` ${chip("red", "Overdue")}` : ""}</td>
      <td class="small">${esc(empName((r.rec && r.rec.Preparer) || ""))}</td>
      <td class="small nowrap">${fmtDate(r.rec && r.rec.FiledDate)}</td><td class="small">${esc(r.rec && r.rec.RefNo)}</td><td class="num">${r.rec && r.rec.Amount ? esc(r.rec.Amount) + ` <span class="faint small">${curOf(r.c)}</span>` : ""}</td>
      <td class="small faint nowrap">${updCell(r.rec)}</td>
      <td><button class="btn sm" data-act="editVat" data-c="${r.c.id}" data-pe="${pe}">Update</button></td></tr>`; }).join("")}
    </tbody></table>${rows.length ? "" : `<div class="empty">No VAT returns fall due in ${ymLabel(f.month)} for these clients.</div>`}</div></div>`;
}
function vatYearView(base){
  const y = +state.vf.year; const months = Array.from({length:12}, (_, i) => `${y}-${pad(i+1)}`);
  const rows = base.filter(c => CYCLES[c.VATCycle] && CYCLES[c.VATCycle].n);

  ${rows.map(c => `<tr><td class="cname nowrap">${state.loc ? "" : locTag(c) + " "}${esc(c.Title)}</td><td class="small faint nowrap">${esc(CYCLES[c.VATCycle].short)}</td>
    ${months.map(m => { if(!isPeriodEnd(c.VATCycle, m)) return `<td class="cell off"></td>`; if(m < vatStart(c)) return `<td class="cell"><span class="faint small">–</span></td>`;
      const st = vatStatus(c.id, m); const dd = daysUntil(dueOf(m, c)); const over = !VAT_DONE.has(st) && dd < 0; const fut = st === "Not started" && dd > 45;

VIEWS.audit = () => {
  const f = state.af; const q = lc(f.q); const y = new Date().getFullYear();
  let rows = auditClients(visibleClients()).filter(c => (!q || lc(c.Title).includes(q)) && (!f.who || teamOf(c).includes(f.who) || lc((auditRec(c.id, f.fy) || {}).AssignedTo) === f.who))
    .map(c => ({ c, fy: f.fy, rec: auditRec(c.id, f.fy), st: auditSt(c, auditRec(c.id, f.fy)) }));
  const total = rows.length, done = rows.filter(r => AUDIT_DONE.has(r.st)).length;
  /* audits of earlier financial years that were started but not completed stay in view */
  const carried = []; const base = auditClients(visibleClients()).filter(c => !isDeact(c) && (!q || lc(c.Title).includes(q)));
  for(const c of base) for(let k = 1; k <= 4; k++){ const fy = String(+f.fy - k); const r = auditRec(c.id, fy); if(!r) continue; const st = auditSt(c, r);
    if(AUDIT_DONE.has(st)) continue; if(f.who && !(teamOf(c).includes(f.who) || lc(r.AssignedTo) === f.who)) continue; carried.push({ c, fy, rec: r, st, carried: true }); }
  carried.sort((a, b) => a.fy.localeCompare(b.fy) || a.c.Title.localeCompare(b.c.Title));
  if(f.show === "pending") rows = rows.filter(r => !AUDIT_DONE.has(r.st)); if(f.show === "done") rows = rows.filter(r => AUDIT_DONE.has(r.st));
  if(f.show !== "done") rows = carried.concat(rows);
  const pct = total ? Math.round(done / total * 100) : 0;
  return `<div class="toolbar">
    <select class="in" data-bind="af.fy">${[0,1,2,3,4].map(i => String(y - i)).map(v => `<option value="${v}" ${f.fy === v ? "selected" : ""}>Financial year ${v}</option>`).join("")}</select>
    <input id="af-q" class="in search" placeholder="Search client…" value="${esc(f.q)}" data-bind="af.q">
    ${isMgr() ? `<select class="in" data-bind="af.who"><option value="">All employees</option>${activeEmployees().map(e => `<option value="${esc(lc(e.Email))}" ${f.who === lc(e.Email) ? "selected" : ""}>${esc(e.Title)}</option>`).join("")}</select>` : ""}
    <select class="in" data-bind="af.show"><option value="all">All statuses</option><option value="pending" ${f.show === "pending" ? "selected" : ""}>Pending only</option><option value="done" ${f.show === "done" ? "selected" : ""}>Completed only</option></select>
  </div>
  <div class="card"><div class="card-b"><div class="progress-row"><div><b>FY${esc(f.fy)} audits</b><div class="small muted">Clients with the <b>Audit</b> service ticked${carried.length ? ` · <span class="over">+ ${carried.length} pending from earlier years shown first</span>` : ""}</div></div><div class="bar"><i style="width:${pct}%"></i></div><div><b>${done}</b> <span class="muted">of ${total} complete (${pct}%)</span></div></div></div>
  <div class="tw"><table class="tbl"><thead><tr><th>Client</th><th>FY end</th><th>Auditor</th><th>Assigned</th><th>Status</th><th>Progress</th><th>Due</th><th>Completed</th><th>Last update</th><th></th></tr></thead><tbody>
  ${rows.map(r => { const idx = auditStatuses(r.c).indexOf(r.st); const steps = auditStatuses(r.c).length - 1; const d = daysUntil(r.rec && r.rec.DueDate); return `<tr>
    <td class="cname">${state.loc ? "" : locTag(r.c) + " "}<a href="#" data-act="openClient" data-id="${r.c.id}" style="color:inherit;text-decoration:none">${esc(r.c.Title)}</a>${r.carried ? ` ${chip("red", "Carried · FY" + esc(r.fy))}` : ""}</td>
    <td class="small nowrap">${fmtDate(r.fy + "-" + (r.c.FYEnd || "12-31"))}</td><td class="small">${esc(r.rec && r.rec.Auditor)}</td>
    <td class="small">${esc(empName((r.rec && r.rec.AssignedTo) || teamOf(r.c)[0] || ""))}</td><td>${auditChip(r.st)}</td>
    <td style="min-width:80px"><div class="steps" title="${esc(r.st)}">${Array.from({length:steps - 1}, (_, i) => `<i class="${/^not applicable$/i.test(r.st) || i < idx ? "on" : ""}"></i>`).join("")}</div></td>
    <td class="small nowrap">${fmtDate(r.rec && r.rec.DueDate)}${d != null && !AUDIT_DONE.has(r.st) ? `<div class="${d < 0 ? "over" : d <= 30 ? "soon" : "faint"}">${relDays(d)}</div>` : ""}</td>
    <td class="small nowrap">${fmtDate(r.rec && r.rec.CompletedDate)}</td>
    <td class="small faint nowrap">${updCell(r.rec)}</td>
    <td><button class="btn sm" data-act="editAudit" data-c="${r.c.id}" data-fy="${esc(r.fy)}">Update</button></td></tr>`; }).join("")}
  </tbody></table>${rows.length ? "" : `<div class="empty">No clients to show.</div>`}</div></div>`;
};

VIEWS.mw = () => {

  return head + (f.mode === "month" ? mwMonthView(base) : f.mode === "year" ? mwYearView(base) : mwAnnualView(base));

function mwTable(rows, svc, labelCol){

const curYear = () => String(new Date().getFullYear());
function othYear(x){ return x.Year || String(x.UpdatedOn || "").slice(0, 4) || curYear(); }
function othFind(cid, name, year){ return data.other.find(x => x.ClientId === cid && lc(x.Service) === lc(name) && (year == null || othYear(x) === String(year))); }

async function syncOthers(c, anyYear){ if(!c || isDeact(c) || !data.other) return 0; let n = 0; const Y = curYear();
  for(const name of otherNamesText(c)){ if(othFind(c.id, name, anyYear ? null : Y)) continue;

function otherItems(clients, year){ const out = []; const t = todayISO(); const ids = new Map(clients.filter(c => !isDeact(c)).map(c => [c.id, c])); const Y = String(year || curYear());
  for(const r of data.other){ const c = ids.get(r.ClientId); if(!c || othYear(r) !== Y) continue; const st = r.Status || "Not started"; const done = OTH_DONE.has(st);
    out.push({ c, name: r.Service, year: Y, rec: r, st, done, due: r.DueDate || "", fu: r.FollowUp || "", over: !done && !!r.DueDate && r.DueDate < t, fuOver: !done && !!r.FollowUp && r.FollowUp <= t }); }

function openModal(type, props){ state.modals.push({ type, props: props || {} }); renderModals(); }
function closeModal(){ state.modals.pop(); renderModals(); }
function renderModals(){
  $("#modals").innerHTML = state.modals.map((m, i) => `<div class="mwrap" data-mi="${i}" style="z-index:${50 + i}">${MODALS[m.type](m.props)}</div>`).join("");
  document.body.style.overflow = state.modals.length ? "hidden" : "";
  const top = state.modals[state.modals.length - 1]; if(top) applySorts($("#modals"), "m:" + top.type + ":" + (state.clientTab || ""));
}
const MODALS = {};
/* ---------- work log: each note is a dated entry kept in the record's Notes field ----------
   entry = "⟦ISO time|email|kind⟧ text"  (kind "s" = automatic status change); older plain text is shown as an earlier note */
function wlParse(rec){ const raw = String((rec && rec.Notes) || ""); if(!raw.trim()) return [];
  if(!raw.includes("⟦")) return [{ at: (rec && rec.UpdatedOn) || "", by: (rec && rec.UpdatedBy) || "", kind: "", text: raw.trim() }];
  return raw.split(/\n?(?=⟦[^⟧]*⟧)/).map(p => { const m = /^⟦([^|⟧]*)\|([^|⟧]*)(?:\|([^⟧]*))?⟧ ?([\s\S]*)$/.exec(p);
    return m ? { at: m[1], by: m[2], kind: m[3] || "", text: m[4].trim() } : { at: "", by: "", kind: "", text: p.trim(), legacy: true }; }).filter(e => e.text); }
function wlEntry(text, kind){ return `⟦${nowISO()}|${me.email}${kind ? "|" + kind : ""}⟧ ${String(text).replace(/[⟦⟧]/g, "").trim()}`; }
function wlNotes(rec, o, prev){ const add = []; if(o.Status && prev && o.Status !== prev) add.push(wlEntry(`Status: ${prev} → ${o.Status}`, "s"));
  if(String(o.NewNote || "").trim()) add.push(wlEntry(o.NewNote));
  let base = String((rec && rec.Notes) || "").trim(); if(base && !base.startsWith("⟦")) base = `⟦${(rec && rec.UpdatedOn) || ""}|${(rec && rec.UpdatedBy) || ""}⟧ ${base.replace(/[⟦⟧]/g, "")}`;
  return [base, ...add].filter(Boolean).join("\n"); }
function wlLast(rec){ const e = wlParse(rec).filter(x => x.kind !== "s").pop(); return e ? e.text : ""; }
function wlText(rec){ return wlParse(rec).map(e => `${e.at ? fmtDT(e.at) + " · " : ""}${e.by ? empName(e.by) + ": " : ""}${e.text}`).join("\n"); }
function wlBlock(rec, ph){ const es = wlParse(rec).reverse();
  return `<div class="full wl"><div class="lbl">Notes / work log <span class="faint" style="font-weight:400">· ${es.length ? es.length + " entr" + (es.length > 1 ? "ies" : "y") : "no entries yet"}</span></div>
    <textarea class="in" name="NewNote" rows="2" placeholder="${esc(ph || "Add a note — saved with your name, date and time")}"></textarea>
    ${es.length ? `<div class="wl-list">${es.map(e => `<div class="wl-e ${e.kind === "s" ? "sys" : ""}"><span class="wl-av">${e.kind === "s" ? "↻" : esc(initials(e.by ? empName(e.by) : "?"))}</span><div style="min-width:0"><div class="wl-h"><b>${esc(e.by ? empName(e.by) : "Earlier note")}</b>${e.at ? ` · ${fmtDT(e.at)}` : ""}</div><div class="wl-t">${esc(e.text)}</div></div></div>`).join("")}</div>` : ""}</div>`; }
function mHead(title, extra){ return `<div class="mh"><h2>${title}</h2>${extra || ""}<button type="button" class="icon-btn x" data-act="close" aria-label="Close">${I.x}</button></div>`; }
function opt(list, val, labels){ return list.map(v => `<option value="${esc(v)}" ${String(val) === String(v) ? "selected" : ""}>${esc(labels ? labels[v] : v)}</option>`).join(""); }
function empOpts(val, blank){ return `<option value="">${blank || "—"}</option>` + activeEmployees().map(e => `<option value="${esc(lc(e.Email))}" ${lc(val) === lc(e.Email) ? "selected" : ""}>${esc(e.Title)}</option>`).join(""); }

/* ============================================================
   FORM SUBMITS
   ============================================================ */
const SUBMIT = {};
function formObj(form){ const fd = new FormData(form); const o = {}; for(const [k, v] of fd.entries()){ if(k in o){ o[k] = [].concat(o[k], v); } else o[k] = v; } return o; }

function buildServices(o){ const picked = [].concat(o.Svc || []); const other = String(o.OtherSvc || "").trim(); return picked.map(s => s === "Others" && other ? "Others: " + other : s).join("; "); }
SUBMIT.client = async (form, o) => {
  const id = form.dataset.id; const team = [].concat(o.AssignedTo || []);
  let code = ""; try { code = normDial(o.ContactCode); } catch(e){ return toast(String(e), true); }
  const prevC = id ? clientById(id) : null; const wantDeact = isAdmin() ? !!o.Deact : isDeact(prevC);
  const f = { Title: o.Title.trim(), Location: o.Location, CTNo: o.CTNo.trim(), CRNo: o.CRNo.trim(), CRExpiry: o.CRExpiry, Status: wantDeact ? "Deactivated" : o.Status, ContactName: o.ContactName, ContactCode: code, ContactNo: o.ContactNo.trim(), ContactEmail: o.ContactEmail,
    VATNo: o.VATNo, VATCycle: o.VATCycle, VATFrom: o.VATFrom, FYEnd: o.FYEnd, AssignedTo: team.join("; "), Reviewer: o.Reviewer, Services: buildServices(o), Notes: o.Notes };
  if(wantDeact && !isDeact(prevC)){ f.DeactivatedOn = todayISO(); f.DeactivatedBy = me.email; }
  if(!wantDeact && isDeact(prevC)){ f.DeactivatedOn = ""; f.DeactivatedBy = ""; }
  const freqLog = [];
  for(const sv of MW_SERVICES){ const want = o["Freq_" + sv] || "Monthly"; const fld = FREQ_FIELD[sv];
    if(!prevC){ if(want === "Annually") f[fld] = ":Annually"; }
    else if(want !== curFreq(prevC, sv)){ const from = /^\d{4}-\d{2}$/.test(o.FreqFrom || "") ? o.FreqFrom : curYM(); f[fld] = freqWith(prevC, sv, from, want); freqLog.push(`${sv}: ${curFreq(prevC, sv)} → ${want} from ${ymLabel(from)}`); } }

  "licence expiry":"CRExpiry","license expiry":"CRExpiry","trade licence expiry":"CRExpiry","trade license expiry":"CRExpiry","licence expiry date":"CRExpiry","license expiry date":"CRExpiry",
  "location":"Location","country":"Location","region":"Location","ct trn":"CTNo","ct no":"CTNo","corporate tax trn":"CTNo","corporate tax no":"CTNo","ct registration no":"CTNo",
  "email":"ContactEmail","contact email":"ContactEmail","vat no":"VATNo","vat number":"VATNo","vat account no":"VATNo","trn":"VATNo","vat trn":"VATNo","notes":"Notes","remarks":"Notes" };

function parseWorkbook(buf){
  const wb = XLSX.read(buf, { type:"array" }); const out = [];
  for(const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:null });
    const hi = rows.findIndex(r => r && r.some(v => /client\s*name/i.test(String(v || "")))); if(hi < 0) continue;
    const H = rows[hi].map(normH); const map = {}; const portals = [];
    H.forEach((h, i) => { if(MASTER_MAP[h] && !(MASTER_MAP[h] in map)) map[MASTER_MAP[h]] = i; });
    H.forEach((h, i) => { const m = /^(.+?)\s+(login|user name|username|user id|userid|id)$/.exec(h); if(!m || MASTER_MAP[h]) return; const p = m[1].trim();
      const pj = H.findIndex(x => x === p + " pwd" || x === p + " password" || x === p + " pass"); portals.push({ name: rows[hi][i].toString().replace(/\s*(login|user\s*name|username|user\s*id|id)\s*$/i, "").trim(), ui: i, pi: pj }); });
    for(const r of rows.slice(hi + 1)){
      if(!r) continue; const title = cellStr(r[map.Title]); if(!title) continue;
      const f = { Status:"Active" }; for(const [k, i] of Object.entries(map)) f[k] = k === "CRExpiry" ? dateCell(r[i]) : cellStr(r[i]);
      if(/deactiv|cancel|struck/i.test(f.CRExpiry || "")){ f.Status = "Deactivated"; f.CRExpiry = ""; }
      if("Location" in f){ f.Location = /uae|dubai|emirat|abu dhabi|sharjah/i.test(f.Location) ? "UAE" : /bahrain|manama|bh/i.test(f.Location) ? "Bahrain" : ""; }
      const creds = portals.map(p => ({ Title: canonPortal(p.name), Username: cellStr(r[p.ui]), Pwd: p.pi >= 0 ? cellStr(r[p.pi]) : "" })).filter(x => x.Username || x.Pwd)
        .map(x => ({ ...x, PortalURL: PORTAL_URLS[x.Title] || "" }));

}
function dateCell(v){ if(typeof v === "number" && v > 20000 && v < 80000){ const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }
  const s = cellStr(v); const m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(s); return m ? `${m[3]}-${pad(m[2])}-${pad(m[1])}` : s; }
function canonPortal(n){ const k = PORTALS.find(p => lc(p) === lc(n)) || (PORTAL_ALIASES.find(([re]) => re.test(n)) || [])[1]; return k || n.replace(/\b\w/g, ch => ch.toUpperCase()); }

async function runImport(){
  const p = state.importPreview; if(!p) return; const mode = ($("#impMode") || {}).value || "skip"; const impLoc = ($("#impLoc") || {}).value || DEFAULT_LOC; const prog = () => $("#impProg");
  for(const row of p.rows) if(!row.f.Location) row.f.Location = impLoc;

  await withBusy(async () => {

      let c = matchClient(row.f);
      if(c && mode === "skip"){ skipped++; continue; }
      if(c){ const upd = {}; for(const [k, v] of Object.entries(row.f)) if(v && k !== "Title") upd[k] = v; if(Object.keys(upd).length){ await store.update("clients", c.id, upd); Object.assign(c, upd); } updated++; }

      for(const cr of row.creds){
        const ex = data.creds.find(x => x.ClientId === c.id && lc(x.Title) === lc(cr.Title));
        const f = { ...cr, ClientId: c.id, UpdatedBy: me.email, UpdatedOn: nowISO() };
